# The reference lane: the upstream B2BUA runner on loopback, on the real
# clock, one runner stood per batch at the ingress below and stopped with it.
# The base runs its cells in the plain replay binary's batch process; each
# call's b-leg is pinned to its cell's callee by the dial's X-Api-Call, so the
# lane serves no backend. Its runner's metrics and admin addresses are the
# `b2bua-runner` part's; each file the runner writes is a part's of its own:
# its log the `runner-log` part's, the file naming its pid the `runner-pid`
# part's, the file it captures its SIP datagrams to the `sip-capture` part's,
# the file it appends its call records to the `cdr-file` part's.
schema = "lane.v1"
description = "the upstream B2BUA runner on loopback, stood per batch"
clock = "real"
order = 2

[sip]
lifecycle = "managed"
ingress = "127.0.0.1:5160"
endpoint_host = "127.0.0.1"

[backend]
mode = "none"

[backend.http_budget]
new_call_ms = 2000
follow_up_ms = 2000
transit_ms = 1

[pacing.campaign]
concurrency = 4
starts_per_second = 50
timing_tolerance_ms = 250

[parts]
b2bua-runner = "reference"
runner-log = "reference"
runner-pid = "reference"
sip-capture = "reference"
cdr-file = "reference"

# The operation a case asks for by the name `restart-worker`: as a step of a
# call it SIGKILLs the runner, so the call is lost with it rather than
# drained (a SIGTERM drains the call, holding the stop until the call ends).
[operations.restart-worker]
operation = "restart-worker"
params = { signal = "SIGKILL" }

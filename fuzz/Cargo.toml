# Coverage-guided fuzzing (ADR-0051 §8): discovery only, never a gate. Its own
# workspace on a pinned nightly, so the main workspace's stable builds, lanes
# and lockfile never see it. `just fuzz <target>` runs a target;
# docs/testing/fuzzing.md says when.
[package]
name = "siprustserver-fuzz"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = [".", "lanes", "seeds"]

[dependencies]
libfuzzer-sys = "0.4"
fuzz-lanes = { path = "lanes" }
call = { path = "../crates/call" }
repl-net = { path = "../crates/repl-net" }
sip-message = { path = "../crates/sip-message" }

# Ordered by blast radius (ADR-0051 §5): every caller reaches the initial
# INVITE before any dialog exists; a panic in a call's turn tears the call
# down; one on the proxy's datagram path, in its health probe or in a
# replication decode restarts a shared task; a parse panic alone is contained
# per datagram.
[[bin]]
name = "initial_invite"
path = "fuzz_targets/initial_invite.rs"
test = false
doc = false
bench = false

[[bin]]
name = "b2bua_turn"
path = "fuzz_targets/b2bua_turn.rs"
test = false
doc = false

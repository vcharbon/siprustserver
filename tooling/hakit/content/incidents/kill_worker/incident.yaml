schema: incident.v1
name: kill_worker
description: >-
  Crash one ready worker: every container process of the pod is killed with
  SIGKILL from its node and proven dead before injected; the kubelet restarts
  it in place. The probe waits until it is Ready again, proves no overlap
  between the crashed incarnation and its successor, and reads the restart
  timings: each survivor's not-ready and park instants of the replication
  peer, the restart and Ready instants, each proxy's drop and take-back of the
  worker.
kind: fault
target:
  selector: app=b2bua-worker
  pick: one
params:
  proxy_selector:
    type: string
    default: app=sip-front-proxy
    description: The front proxies whose drop and take-back of the restarted worker are timed; empty skips them.
  proxy_container:
    type: string
    default: sip-front-proxy
    description: The proxy container whose log holds the registry, health and acceptance lines.
duration_s: 0
expected_s: 60
timeouts:
  inject_s: 30
  heal_s: 10
  probe_s: 180
  probe_interval_s: 2
requires: [kind, docker]

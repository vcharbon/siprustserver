schema: incident.v1
name: partition
description: >-
  Partition the target pods (one or all) from their peers, both directions,
  for duration_s (Chaos Mesh NetworkChaos). The peers are the pods of
  peer_selector, or else the other live pods of the target selector: by
  default one worker cut from the others, the replication link gone and each
  side vanished from the other. Host-network pods are refused.
kind: fault
target:
  selector: app=b2bua-worker
  pick: one
params:
  peer_selector:
    type: string
    default: ""
    description: The pods cut from the targets; empty is the other live pods of the target selector.
  inject_wait_s:
    type: integer
    default: 30
    description: How long inject waits for Chaos Mesh to report the partition injected.
duration_s: 60
timeouts:
  inject_s: 60
  heal_s: 120
requires: [kind, chaos-mesh]

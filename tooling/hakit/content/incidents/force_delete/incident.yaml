schema: incident.v1
name: force_delete
description: >-
  Force-delete one pod (pick one) or every pod (pick all) through the API,
  grace 0, leaving its processes running: the workload's replacement starts
  while the elder still runs, a split brain like a partitioned node's pod
  outliving its replacement. The probe follows the elder on its node until it
  exits and measures the overlap of the two incarnations.
kind: fault
target:
  selector: app=b2bua-worker
  pick: one
duration_s: 0
expected_s: 60
timeouts:
  inject_s: 30
  heal_s: 10
  probe_s: 180
  probe_interval_s: 1
requires: [kind, docker]

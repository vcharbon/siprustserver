schema: incident.v1
name: cpu_starve
description: >-
  Cap the CPU of one pod (pick one) or every pod (pick all), its pod-level
  cgroup, to quota_us per period_us for duration_s, with no restart: the
  overload of scarcity. With pick all no healthy peer is left to absorb the load.
kind: fault
target:
  selector: app=b2bua-worker
  pick: one
params:
  quota_us:
    type: integer
    default: 30000
    description: The CPU time the container may use per period, in microseconds.
  period_us:
    type: integer
    default: 100000
    description: The cgroup period, in microseconds.
duration_s: 90
timeouts:
  inject_s: 60
  heal_s: 60
requires: [kind, docker]

schema: incident.v1
name: tcp_reset
description: >-
  Answer every new TCP connection to `port` of the target pods with a reset for
  duration_s, except from the pod's own node (its probes): the fast-failure
  path of a refused dependency.
kind: fault
target:
  selector: app=call-limiter
  pick: one
params:
  port:
    type: integer
    default: 8080
    description: The TCP port whose new connections are reset.
duration_s: 60
timeouts:
  inject_s: 60
  heal_s: 60
requires: [kind, docker]

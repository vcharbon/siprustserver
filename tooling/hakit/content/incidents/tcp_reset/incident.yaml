schema: incident.v1
name: tcp_reset
description: >-
  Answer every new TCP connection to `port` of the target pods with a reset for
  duration_s, except from the pod's own node (its probes): the fast-failure
  path of a refused dependency.
  On a host-network pod the fault hits its whole node: such a target is
  refused unless allow_host_network.
kind: fault
target:
  selector: app=call-limiter
  pick: one
params:
  allow_host_network:
    type: boolean
    default: false
    description: Allow a host-network target, whose netns is its node's; the fault then hits every pod and the kubelet of that node.
  port:
    type: integer
    default: 8080
    description: The TCP port whose new connections are reset.
duration_s: 60
timeouts:
  inject_s: 60
  heal_s: 60
requires: [kind, docker]

schema: incident.v1
name: net_delay
description: >-
  Delay every packet the target pods send by delay_ms (netem on eth0) for
  duration_s: a component that answers, later than its clients wait.
kind: fault
target:
  selector: app=call-limiter
  pick: one
params:
  delay_ms:
    type: integer
    default: 300
    description: The added one-way delay in milliseconds.
duration_s: 60
timeouts:
  inject_s: 60
  heal_s: 60
requires: [kind, docker]

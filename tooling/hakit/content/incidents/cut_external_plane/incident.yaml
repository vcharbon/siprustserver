schema: incident.v1
name: cut_external_plane
description: >-
  Disconnect the node of one front proxy from the callers' docker network for
  duration_s, then reconnect it at its own address and interface name: the
  node loses its
  caller-facing interface. Its proxy turns not ready (the external face is
  unusable), so the node withdraws both VIPs, the internal one too, and the
  peer carries every flow. Inject measures, from the cut, when the node left
  each VIP's next hops in the host's table. The probe wants the interface back,
  the external VIP's routing table holding its next hops again with no container
  restarted, and both VIPs routed over every live proxy's node again.
kind: fault
target:
  selector: app=sip-front-proxy
  pick: one
params:
  internal_vip:
    type: string
    default: 172.20.255.250
    description: The VIP the workers reach the proxies at.
  external_vip:
    type: string
    default: 192.168.60.250
    description: The VIP the callers dial.
  network:
    type: string
    default: sipext
    description: The docker network of the callers' plane.
  interface:
    type: string
    default: eth1
    description: The interface name the node's endpoint on that network takes again at heal.
  withdraw_timeout_s:
    type: integer
    default: 30
    description: How long inject waits for the node to leave both VIPs' next hops.
duration_s: 60
timeouts:
  inject_s: 60
  heal_s: 60
  probe_s: 120
  probe_interval_s: 2
requires: [kind, docker]

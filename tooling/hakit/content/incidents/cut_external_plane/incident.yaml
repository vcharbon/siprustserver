schema: incident.v1
name: cut_external_plane
description: >-
  Disconnect the node of the front proxy holding the virtual address from the
  callers' docker network for duration_s, then reconnect it at its own
  address: the master loses its caller-facing interface, and its peer must
  take the addresses over (keepalived tracks the interface). The probe waits
  for exactly one holder.
kind: fault
target:
  selector: app=sip-front-proxy
  pick: one
params:
  address:
    type: string
    default: 192.168.60.250
    description: The virtual address the callers dial.
  network:
    type: string
    default: sipext
    description: The docker network of the callers' plane.
  container:
    type: string
    default: keepalived
    description: The container of the proxy pod through which its addresses are read (it needs `ip`).
duration_s: 60
timeouts:
  inject_s: 60
  heal_s: 60
  probe_s: 120
  probe_interval_s: 2
requires: [kind, docker]

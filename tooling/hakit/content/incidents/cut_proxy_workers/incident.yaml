schema: incident.v1
name: cut_proxy_workers
description: >-
  Cut one front proxy off the workers of worker_selector (every worker by
  default) for duration_s: its node drops every packet from their pod
  addresses (the proxy's health probes go unanswered, their requests through
  that node are lost), while the peer proxy keeps them all. Cut off every
  worker, the proxy reads them all dead, turns not ready, and its node
  withdraws both VIPs; the peer carries every flow. Cut off some, it stays fit
  and announced, reading those dead while the peer reads them alive. With
  withdraw, inject measures, from the cut, when the node left each VIP's next
  hops in the host's table; heal deletes the rules; the probe wants both VIPs
  routed over every live proxy's node again.
kind: fault
target:
  selector: app=sip-front-proxy
  pick: one
params:
  worker_selector:
    type: string
    default: app=b2bua-worker
    description: The workers the proxy is cut off.
  withdraw:
    type: boolean
    default: true
    description: >-
      Wait for the node to leave both VIPs' next hops. A cut from some workers
      only leaves the proxy fit and its routes in place: false skips the wait.
  internal_vip:
    type: string
    default: 172.20.255.250
    description: The VIP the workers reach the proxies at.
  external_vip:
    type: string
    default: 192.168.60.250
    description: The VIP the callers dial.
  network:
    type: string
    default: sipext
    description: The docker network of the callers' plane.
  withdraw_timeout_s:
    type: integer
    default: 30
    description: How long inject waits for the node to leave both VIPs' next hops.
duration_s: 30
timeouts:
  inject_s: 90
  heal_s: 60
  probe_s: 120
  probe_interval_s: 2
requires: [kind, docker]

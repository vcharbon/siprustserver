schema: incident.v1
name: kill_proxy
description: >-
  Crash one front proxy of the active-active pair: every container process of
  the pod is killed with SIGKILL and proven dead. Its node withdraws both
  VIPs (its route guard's last refresh runs out, the pod is no longer Ready)
  and the routers move its flows to the peer; the kubelet restarts the
  crashed pod. Inject measures, from the kill, when the node left each VIP's
  next hops in the host's table. The probe waits for the restart, proves no
  incarnation overlap, and wants both VIPs routed over every live proxy's
  node again.
kind: fault
target:
  selector: app=sip-front-proxy
  pick: one
params:
  internal_vip:
    type: string
    default: 172.20.255.250
    description: The VIP the workers reach the proxies at.
  external_vip:
    type: string
    default: 192.168.60.250
    description: The VIP the callers dial.
  network:
    type: string
    default: sipext
    description: The docker network of the callers' plane.
  withdraw_timeout_s:
    type: integer
    default: 30
    description: How long inject waits for the node to leave both VIPs' next hops.
duration_s: 0
expected_s: 60
timeouts:
  inject_s: 60
  heal_s: 10
  probe_s: 180
  probe_interval_s: 2
requires: [kind, docker]

schema: incident.v1
name: kill_proxy
description: >-
  Crash one front proxy of the active-active pair: every container process of
  the pod is killed with SIGKILL and proven dead; the kubelet restarts them.
  The node's route guard withdraws both VIPs (its last refresh runs out) and
  the routers move the node's flows to the peer. Inject measures, from the
  kill, when the node left each VIP's next hops in the host's table; when the
  restarted guard found the restarted proxy fit within its dead-man bound, it
  lets the node out at once and inject records that instead, with any later
  withdrawal through readiness apart. The probe waits for the restart, proves
  no incarnation overlap, and wants both VIPs routed over every live proxy's
  node again.
kind: fault
target:
  selector: app=sip-front-proxy
  pick: one
params:
  internal_vip:
    type: string
    default: 172.20.255.250
    description: The VIP the workers reach the proxies at.
  external_vip:
    type: string
    default: 192.168.60.250
    description: The VIP the callers dial.
  network:
    type: string
    default: sipext
    description: The docker network of the callers' plane.
  withdraw_timeout_s:
    type: integer
    default: 30
    description: How long inject waits for the node to leave both VIPs' next hops.
  guard_window_s:
    type: integer
    default: 4
    description: >-
      How long inject waits for the route guard's withdrawal (its bound,
      proxy.routeGuard.withdrawWithinMs, rounded up) before it reads whether
      the guard restarted onto a fit proxy.
  dead_ms:
    type: integer
    default: 1000
    description: >-
      The route guard's dead-man bound (ROUTE_GUARD_DEAD_MS): a guard that
      started later than this after the kill did not find the proxy fit
      before the last refresh ran out.
  guard_container:
    type: string
    default: route-guard
    description: >-
      The node's route guard container: restarted onto a proxy already fit
      again, it lets the node out before the last refresh ran out.
duration_s: 0
expected_s: 60
timeouts:
  inject_s: 60
  heal_s: 10
  probe_s: 180
  probe_interval_s: 2
requires: [kind, docker]

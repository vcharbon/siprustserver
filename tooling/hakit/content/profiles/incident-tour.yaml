schema: profile.v1
name: incident-tour
description: >-
  Every base incident fired once under a modest basic load, with the targets
  of this repository's lab: the worker kills, the proxy kill and plane cut,
  the call limiter and the broker hung, slowed, refused, cut and restarted,
  the infrastructure node stopped, the replication link partitioned, the SIP
  plane made lossy, a store stalled, a clock shifted, a spike, the overload
  of CPU scarcity plus a spike, orphaned dialogs, a pod force-deleted while
  its process runs on, and an in-dialog request flood. Each window carries the
  budget of what its fault may cost.
duration_s: 3500
drain_s: 130
settle_s: 15
setup_slow_ms: 1000
catalogs: [x-api-call]
preflight:
  min_free_memory_gib: 4
  min_free_disk_gib: 10
streams:
  - name: basic
    driver: sipp
    shape: basic
    scenario: uac-basic-hold.xml
    cps: 10
    setup_deadline_s: 10
    ring_s: 5
    hold_s: 20
  - name: burst
    driver: sipp
    start: incident
    shape: basic
    scenario: uac-basic-hold.xml
    cps: 50
    setup_deadline_s: 10
    ring_s: 5
    hold_s: 2
  - name: orphaned
    driver: sipp
    start: incident
    shape: basic
    scenario: uac-basic-hold.xml
    cps: 10
    setup_deadline_s: 10
    ring_s: 5
    hold_s: 60
  - name: flooding
    driver: sipp
    start: incident
    shape: basic
    scenario: uac-basic-hold.xml
    cps: 5
    setup_deadline_s: 10
    ring_s: 5
    hold_s: 1
    params: { abuse: options_flood, flood_count: 30, flood_gap_ms: 1000 }
schedule:
  at:
    - { at_s: 30, incident: kill_worker, budget: worker-kill }
    - { at_s: 135, incident: kill_worker_graceful, budget: worker-drain }
    - { at_s: 270, incident: kill_worker_held, duration_s: 60, budget: worker-kill }
    - { at_s: 435, incident: kill_proxy, budget: proxy-failover }
    - { at_s: 540, incident: pod_kill, budget: dependency-fault }
    - { at_s: 645, incident: pod_restart, budget: dependency-fault }
    - { at_s: 780, incident: pod_freeze, duration_s: 15, budget: dependency-fault }
    - { at_s: 900, incident: net_delay, duration_s: 30, budget: dependency-fault }
    - { at_s: 1035, incident: net_loss, duration_s: 30, budget: dependency-fault }
    - { at_s: 1170, incident: tcp_reset, duration_s: 30, budget: dependency-fault }
    - at_s: 1305
      incident: pod_freeze
      target: { selector: app=rabbitmq }
      duration_s: 30
      budget: dependency-fault
    - { at_s: 1440, incident: cpu_starve, duration_s: 60, budget: cpu-overload }
    - { at_s: 1605, incident: node_stop, duration_s: 60, expected_s: 240, budget: dependency-fault }
    - { at_s: 1890, incident: partition, duration_s: 30, budget: dependency-fault }
    - { at_s: 2025, incident: sip_loss, duration_s: 30, budget: lossy-plane }
    - { at_s: 2160, incident: io_stall, duration_s: 30, budget: dependency-fault }
    - { at_s: 2295, incident: clock_skew, duration_s: 30, budget: dependency-fault }
    - { at_s: 2430, incident: cut_external_plane, duration_s: 30, budget: proxy-cut }
    - { at_s: 2565, incident: spike, stream: burst, budget: spike }
    - { at_s: 2790, incidents: [cpu_starve, spike], stream: burst, duration_s: 30, expected_s: 180, budget: cpu-overload }
    - { at_s: 3015, incident: force_delete, budget: worker-kill }
    - { at_s: 3120, incident: orphan, stream: orphaned, budget: dependency-fault }
    - { at_s: 3255, incident: abuse, stream: flooding, budget: abuse }

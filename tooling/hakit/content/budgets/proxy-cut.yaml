schema: budget.v1
name: proxy-cut
description: >-
  One front proxy cut off a plane while its process runs (its node off the
  callers' network, or cut off every worker): its /fitz fails and its node's
  route guard drops the node's BFD and BGP, so the routers withdraw both
  VIPs within W of the cut (ADR-0056 §10). W is the route guard's bound
  (proxy.routeGuard.withdrawWithinMs, 3.4 s, checked at render): detection
  (the worker cut's isolation verdict, HEALTH_ISOLATION_MS 2 s; the external
  cut's face check, 0.5 s) + one poll (0.1 s) + the routers' BFD detection
  (3 × 300 ms). Until then every datagram of a flow that hashes to the cut
  node is lost; one peer address and port is one flow, so a single-flow peer
  (a caller, a worker, a callee) has all its traffic on one node or none
  (ADR-0056 §8). W is below o = 3.5 s, the last retransmission (0, 0.5, 1.5,
  3.5 s, RFC 3261 §17.1.1.2, §13.3.1.4, T1 500 ms) that can still answer a
  call whose callee answers Ra = 5 s after the INVITE within the caller's
  10 s deadline, so every request or 2xx first sent in the window reaches
  the peer with a retransmission in time. Each allowance is a mechanism of
  that window, in seconds of offered rate:
  - setup timeout, 1 s: a request the cut proxy had read and not yet relayed
    when the cut came, whose sender's retransmissions are already spent;
  - 480 with Reason q.850;cause=18, 1 s: a worker's b-leg INVITE in the same
    instant, which the worker gives up on with no answer;
  - 503 with Retry-After, W = 3.4 s: the cut-off proxy that reads every
    worker dead answers a new call 503 with a Retry-After until its node's
    routes are withdrawn (ADR-0056 §3), so the caller may retry elsewhere;
  - setups slow for the window, W = 3.4 s;
  - a CDR duration off by up to the first retransmission of a 2xx or BYE at
    or past W, 3.5 s, the split-view mismatch two proxies with different
    health views produce while the cut node's view is stale (ADR-0009 X7).
    No call is answered after its caller gave up: W < o;
  - a dialog request overtaken by the next, W = 3.4 s per kind: the worker
    sends a dialog's requests without waiting for the previous one's final
    (a transfer's NOTIFY with the referred call's 100, then its 200: RFC 6665
    §4.2.2 sends each state change at once). The first, sent in the window,
    is lost on the cut path; the next, sent after the withdrawal, arrives
    first (`dialog-cseq-skip`), and the first one's retransmission then
    arrives under a lower CSeq (`dialog-cseq-backwards`), which the receiver
    answers 500 (RFC 3261 §12.2.2); the transfer completes. At most the
    dialogs whose first request falls in the window (measured 2.5 s of the
    transfer stream's rate, with the earlier 5.9 s withdrawal).
setup_failed:
  - { stream: "*", code: 0, reason: timeout, max_seconds: 1 }
  - { stream: "*", code: 480, reason: "q.850;cause=18", max_seconds: 1 }
  - { stream: "*", code: 503, reason: "*", retry_after: true, max_seconds: 3.4 }
setup_slow:
  max_seconds: 3.4
cdr_mismatch:
  differs:
    max_calls: 0
    excess_ms: 3500
in_dialog:
  - { stream: "*", class: protocol_anomaly, detail: dialog-cseq-skip, max_seconds: 3.4 }
  - { stream: "*", class: protocol_anomaly, detail: dialog-cseq-backwards, max_seconds: 3.4 }

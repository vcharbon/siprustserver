schema: budget.v1
name: worker-crash-loop
description: >-
  A worker crashing again and again on its live node, five rounds at most before
  the kubelet's backoff is long: INVITEs placed on it before each death hear
  nothing and end their setup without a final, about 0.5 s of the offered rate per
  death when it read ready between them, so about 3 s over a loop for a stream of
  a few calls a second, and setups slower for as long. Each death is the
  worker-kill crash and takes its CDR bound: a BYE or a callee's 2xx in flight to
  the dying process reaches the backup on its first retransmission past the
  proxy's verdict, which the endpoint's flip may bring early but the probe brings
  3.6 s after the death at the latest, when the worker read alive before it. That
  retransmission is the one at 7.5 s (RFC 3261, T1 500 ms, T2 4 s), so a CDR's end
  or answer may lead the caller's by that much. A caller who heard a provisional
  and no final takes no allowance here or in any budget
  (`silent_after_provisional`). Every other failed setup, and any other CDR
  mismatch, is a finding.
setup_failed:
  - { stream: "*", code: 0, reason: timeout, max_seconds: 3 }
setup_slow:
  max_seconds: 3
cdr_mismatch:
  differs:
    max_calls: 0
    excess_ms: 7500

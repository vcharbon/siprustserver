schema: budget.v1
name: worker-kill
description: >-
  A worker crash: about 2 s of the offered rate may hear nothing and end its
  setup without a final. These are the INVITEs sent to the dead worker before
  the proxy read it dead, whose retransmissions then reach its backup, which
  holds no record of them and drops them; a caller who hears nothing goes
  elsewhere by itself. A caller who heard a provisional and no final takes no
  allowance here or in any budget (`silent_after_provisional`). Every other
  failed setup is a finding.
setup_failed:
  - { stream: "*", code: 0, reason: timeout, max_seconds: 2 }
setup_slow:
  max_seconds: 2

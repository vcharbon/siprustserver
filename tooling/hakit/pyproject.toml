[project]
name = "hakit"
version = "0.1.0"
description = "Pluggable HA tooling base: incidents, impact budgets, run profiles and per-call outcome records (ADR-0049)."
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
]

[project.scripts]
hakit = "hakit.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20260906",
]

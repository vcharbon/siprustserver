# One rustfmt config for this workspace and upstream/siprustserver — the two
# files are byte-identical, `just fmt-check` says so. Every option here is
# stable, so `cargo fmt` on the pinned toolchain is the whole story.
#
# `Max` widths + 100 columns is the style the tree was already written in;
# `style_edition` is pinned so a future crate edition bump cannot reflow it.
edition = "2021"
style_edition = "2021"
max_width = 100
use_small_heuristics = "Max"
newline_style = "Unix"

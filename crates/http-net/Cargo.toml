[package]
name = "http-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Reusable unary HTTP transport seam (request/response, no streaming) and the outbound backend client on it (name lookup, in-flight cap, rotation, breaker, retry), and a feature-gated RealHttpNetwork (hyper + reqwest) for production. The simulated fabric, the recording decorator and the scripted service live in http-net-testkit. Bodies are opaque bytes — JSON/serde lives in the consumer."

[package.metadata.purity]
tier = "shell"

[package.metadata.ha]
side = "blind"

[lints]
workspace = true

[features]
# The real (hyper server + pooled reqwest client) transport. Off by default so
# leaf test crates never compile the HTTP-framework tree; the runner turns it on.
real = [
    "dep:reqwest",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:bytes",
]

[dependencies]
lock-poison = { path = "../lock-poison" }
metric-catalogue = { path = "../metric-catalogue" }
metric-values = { path = "../metric-values" }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

# --- real transport only (feature "real") ---
# Pooled, keep-alive HTTP client (the b2bua makes many small calls). No TLS —
# internal cluster http:// only. Workspace-pinned so the process links exactly
# one reqwest major (shared with the OTLP exporter).
reqwest = { workspace = true, optional = true }
# Real HTTP/1.1 server with connection keep-alive.
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
tokio = { workspace = true }
# `cargo test -p http-net` exercises the real transport too.
http-net = { path = ".", features = ["real"] }
# The backend client's tests run over the simulated fabric.
http-net-testkit = { path = "../http-net-testkit" }
sip-clock = { path = "../sip-clock", features = ["testkit"] }
# The loopback classifier test resets a connection (SO_LINGER 0).
socket2 = { workspace = true }

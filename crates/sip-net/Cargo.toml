[package]
name = "sip-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "SIP signaling network layer (UDP transport + SignalingNetwork) — Rust port of sipjsserver src/sip/{SignalingNetwork,UdpTransport} core. Real (tokio), simulated (in-memory fabric), and a recording/audit decorator."

# The IPv4/IPv6 path-MTU-discovery mode (ADR-0026) has no safe wrapper: it is a
# raw `setsockopt`/`getsockopt`, which the workspace's `forbid(unsafe_code)`
# lint cannot admit locally. This crate pins `deny` instead — every other
# crate's guarantee still holds — and the two call sites in `fragmentation.rs`
# each carry a narrow `#[allow(unsafe_code)]` with a SAFETY comment. Leaving
# `[lints] workspace = true` out drops the workspace table entirely, so the
# block below MIRRORS it — a lint added there must be added here too.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
too_many_lines = "warn"

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
socket2 = { workspace = true }
libc = { workspace = true }
layer-harness = { path = "../layer-harness" }
sip-clock = { path = "../sip-clock" }
sip-message = { path = "../sip-message" }

[dev-dependencies]
# `test-util` adds the paused-clock lever (`tokio::time::pause`/`advance`) the
# BufferedUdpEndpoint sweep/idle-TTL tests drive (`#[tokio::test(start_paused)]`).
tokio = { workspace = true, features = ["test-util"] }

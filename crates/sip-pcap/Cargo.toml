[package]
name = "sip-pcap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Offline capture → SIP callflow triage tooling (never in a runner). Decodes tcpdump ring files and archived corpora — classic pcap and pcapng, plain or gzipped, detected from the bytes — with a hand-rolled container/L2/L3 decoder including IPv4/IPv6 fragment reassembly, parses every UDP datagram with the real sip-message parser, correlates B2BUA a/b legs (relayed X-Loadgen-Id / X-Api-Call tokens + From/To adjacency fallback), and prints per-call message ladders filtered by Call-ID / From / To / R-URI / final status. See the `sipflow` bin."

[lints]
workspace = true

[dependencies]
sip-message = { path = "../sip-message" }
rfc-rules = { path = "../rfc-rules" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }

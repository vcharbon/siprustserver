[package]
name = "http-net-testkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Test support of the unary HTTP transport seam: the SimulatedHttpNetwork in-memory fabric (per-destination and per-attempt faults reported as reqwest classifies them, transit delay) for paused-clock tests, the RecordingHttpNetwork decorator onto the layer-harness Recorder, and the scripted HttpService. It declares no purity tier, so no production binary links it."

[package.metadata.ha]
side = "aware"

[lints]
workspace = true

[dependencies]
http-net = { path = "../http-net" }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
# The recording decorator records onto the test harness's `Recorder`.
layer-harness = { path = "../layer-harness" }
# The scripted service (`scripted`): programs are serde documents, request
# bodies are validated as JSON before fragment matching, and the continuation
# token is base64url on the wire.
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
# The scripted service and the recording decorator also run over the real transport.
http-net = { path = "../http-net", features = ["real"] }
sip-clock = { path = "../sip-clock", features = ["testkit"] }

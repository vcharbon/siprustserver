[package]
name = "e2e-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The e2e cell result record (ADR-0018): the result.json a crate's in-test reporter writes for one campaign cell, folded from a scenario-harness RunReport."

[package.metadata.ha]
side = "aware"

[lints]
workspace = true

[dependencies]
e2e-model = { path = "../e2e-model" }
scenario-harness = { path = "../scenario-harness" }
seq-report = { path = "../seq-report" }
sip-net-testkit = { path = "../sip-net-testkit" }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

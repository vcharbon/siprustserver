[package]
name = "route-guard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Node route guard beside a BGP-announced front proxy: polls the proxy's local /fitz and keeps an nftables set that lets the node's BFD and BGP to its routers out for a dead-man bound per refresh, so an unfit, hung or dead proxy takes its node out of the routers' ECMP within the BFD detection time."

[package.metadata.purity]
tier = "shell"

[package.metadata.ha]
side = "aware"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "route-guard"
path = "src/main.rs"

[dependencies]
metric-catalogue = { path = "../metric-catalogue" }
# The /metrics + /healthz server the runners share.
probe-http = { path = "../probe-http" }
tokio = { workspace = true }
# Process subscriber + lifecycle logging (ADR-0026).
observe = { path = "../observe", features = ["otlp"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[package]
name = "pivot-replay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The replay runner library over the pivot interpreter: a run-spec in, a run bundle out, the exit code the structural verdict. It owns the lane mechanics (the case's load and lint gate, number allocation, agent binding, the simulated lane's paused runtime, the hosted lane and its batch process, the RFC audit, the verdict's verification lines, the bundle's side files) and the registration seam a product fills (the simulated and hosted systems under test, the backend double, the gate table and the batch's end gates, exports). The `pivot-replay` binary runs it with nothing registered."

[package.metadata.ha]
side = "aware"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pivot-replay"
path = "src/main.rs"

[dependencies]
pivot-schema = { path = "../pivot-schema" }
pivot-interpreter = { path = "../pivot-interpreter" }
sip-message = { path = "../sip-message", features = ["sniff"] }
scenario-harness = { path = "../scenario-harness" }
sip-clock = { path = "../sip-clock" }
sip-net = { path = "../sip-net" }
sip-net-testkit = { path = "../sip-net-testkit" }
http-net = { path = "../http-net", features = ["real"] }
http-net-testkit = { path = "../http-net-testkit" }
# The plain simulated system under test: the B2BUA on the simulated fabric,
# its decisions scripted to the case's egress endpoint.
b2bua = { path = "../b2bua", features = ["testkit"] }
b2bua-harness = { path = "../b2bua-harness" }
layer-harness = { path = "../layer-harness" }
observe = { path = "../observe" }
call = { path = "../call" }
sha1 = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
rustix = { version = "1", features = ["process"] }

[package]
name = "pcap-anon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A SIP capture anonymiser (offline tooling, never in a runner): rewrites the `sipflow --json` flows document whole under a numbering plan, a network profile and a seed kept beside the raw capture, checks that nothing of the raw document survives, and writes the agent-readable callflow (source.txt) and a summary of the run (auto.json). See the crate's README."

[package.metadata.ha]
side = "aware"

[lints]
workspace = true

[[bin]]
name = "pcap-anon"
path = "src/bin/pcap-anon.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sip-message = { path = "../sip-message", features = ["sniff"] }
# The flows-document contract: a rewritten document is re-enriched through it
# instead of carrying a stale projection.
sip-pcap = { path = "../sip-pcap" }
clap = { version = "4", features = ["derive"] }
# The keyed fake mapping: HMAC-SHA256 under a per-launch seed (`fake` module).
hmac = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
# The one-pass multi-pattern rewrite (`rewrite` module).
aho-corasick = { workspace = true }

[dev-dependencies]
# The flows document's schema, walked by the guard over its text fields.
schemars = { workspace = true }

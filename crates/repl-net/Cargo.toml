[package]
name = "repl-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "HA replication wire layer: the five positional-msgpack replication frames + single-frame codec + 4-byte length-prefix framing. Call-agnostic — bodies are opaque bytes. The transport seam lives in `transport`. See ADR-0011 X9 / docs/plan/on-proper-migration-of-lazy-pancake.md."

[package.metadata.purity]
tier = "shell"

[package.metadata.ha]
side = "aware"

[lints]
workspace = true

[dependencies]
# Low-level msgpack: hand-write array_len + per-element writes for exact
# positional control of the [tag, ...] frame layout (ADR-0008 ethos). A
# serde-derived enum would not produce clean tag-led arrays.
rmp = { workspace = true }
thiserror = { workspace = true }
# Transport seam: the real TCP impl (net, io-util) and the runtime it rides.
tokio = { workspace = true }
async-trait = { workspace = true }
# TCP keepalive and TCP_USER_TIMEOUT on the real transport's streams.
socket2 = { workspace = true, features = ["all"] }
# A socket option the kernel refuses is logged.
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# The no-panic lane's runner and binary mutations (ADR-0051 §8).
wire-mutations = { path = "../wire-mutations" }
# The error-path tests hand-build malformed msgpack arrays directly.
rmp = { workspace = true }
# The real-TCP tests run on a non-paused runtime.
tokio = { workspace = true }

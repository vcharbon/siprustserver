[package]
name = "call"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CallContext data model (Call→Leg→Dialog) + lens helpers + pluggable body codec. Pure synchronous leaf; the stateful CallState + TimerService live with the b2bua runtime (ADR-0008)."

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
thiserror = { workspace = true }
# The class a replicated ladder paces by (ADR-0032 X3); `serde` so it rides the body.
sip-retransmit = { path = "../sip-retransmit", features = ["serde"] }

[dev-dependencies]
proptest = { workspace = true }
base64 = { workspace = true }

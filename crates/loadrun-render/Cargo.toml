[package]
name = "loadrun-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The one HTML renderer of a load run: a LoadRunIndex (load-result.json) to the report page the load generator serves live and writes as its final index.html. Plain HTML and inline SVG, no script."

[package.metadata.ha]
side = "aware"

[lints]
workspace = true

[dependencies]
e2e-model = { path = "../e2e-model" }
# The message ladders are drawn through the shared sequence-diagram renderer.
seq-report = { path = "../seq-report" }

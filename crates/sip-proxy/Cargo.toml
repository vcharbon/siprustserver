[package]
name = "sip-proxy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Ingress hands the receive buffer to the parser as a refcounted `Bytes`, so
# the parsed message shares it rather than copying the datagram.
bytes.workspace = true
sip-message = { path = "../sip-message" }
sip-net = { path = "../sip-net" }
sip-clock = { path = "../sip-clock" }
sip-txn = { path = "../sip-txn" } # IdGen (Via branch generation) only — the proxy is stateless
topology = { path = "../topology" } # cluster-membership identity substrate (ADR-0002: proxy → topology)
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
arc-swap = { workspace = true }
# Instrumentation facade (ADR-0026): lifecycle events go out through `tracing`;
# the subscriber is the runner's. `observe` brings the burst-aggregation helpers
# only — default features, so no OpenTelemetry tree here.
tracing = { workspace = true }
observe = { path = "../observe", default-features = false }

[dev-dependencies]
scenario-harness = { path = "../scenario-harness" }
layer-harness = { path = "../layer-harness" }

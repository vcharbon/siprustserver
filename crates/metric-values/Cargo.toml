[package]
name = "metric-values"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The values a process holds for its declared metric families, shared across its threads: one lock-free counter per declared label set of a fixed family, the observed rows of a semi-open one under its cap. Each renders through its family's catalogue entry."

[package.metadata.purity]
tier = "shell"

[package.metadata.ha]
side = "blind"

[lints]
workspace = true

[dependencies]
lock-poison = { path = "../lock-poison" }
metric-catalogue = { path = "../metric-catalogue" }

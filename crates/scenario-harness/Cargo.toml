[package]
name = "scenario-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Cross-layer scenario test harness + report renderers — Rust port of sipjsserver src/test-harness/framework. Drives named agents (alice/bob) over the recording-wrapped simulated SignalingNetwork and projects the recording into SVG / global.txt / per-endpoint views. TEST-ONLY."

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
# The per-endpoint actor runner (`src/actor`) joins N reactor futures on ONE
# task via `FuturesUnordered` (no `tokio::spawn` — determinism under the paused
# clock); see docs/todos/actor-harness-impl-plan.md §1.
futures = "0.3"
# The typed `X-Api-Call` control header of the shared egress model
# (`egress::ApiCall`) serializes through serde, so every emitter builds the
# same JSON instead of hand-formatting it.
serde = { workspace = true }
serde_json = { workspace = true }
sip-message = { path = "../sip-message" }
# The thread-scoped in-memory subscriber a run captures the SUT's lifecycle logs
# and per-call trace into, dumped to stderr when a scenario panics (ADR-0026).
# No `otlp` feature: a test never exports.
observe = { path = "../observe" }
sip-net = { path = "../sip-net" }
layer-harness = { path = "../layer-harness" }
seq-report = { path = "../seq-report" }
sip-clock = { path = "../sip-clock", features = ["testkit"] }

[dev-dependencies]
tokio = { workspace = true }
# Test-only: the harness itself never emits. Its own tests log through the
# facade to prove the capture buffer a run installs is the one that sees it.
tracing = { workspace = true }

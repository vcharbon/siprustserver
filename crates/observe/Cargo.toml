[package]
name = "observe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Process observability foundation (ADR-0026): subscriber installation (compact key=value lifecycle logs over a non-blocking bounded lossy stdout writer; OTLP trace export only when OTEL_EXPORTER_OTLP_ENDPOINT is set), the per-call trace admission chain (rate draw -> token bucket -> active cap), the 16 KiB attribute cap, and the thread-scoped in-memory subscriber tests capture with. Domain crates depend on `tracing` alone — the OpenTelemetry dependency tree terminates here."

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# OTLP export tree. Present unconditionally in this crate (and only here) so the
# runtime env gate — not a build flag — decides whether a process exports.
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

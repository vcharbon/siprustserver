[package]
name = "b2bua-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Test-only harness: binds a real `b2bua` B2buaCore as a System-Under-Test on the scenario-harness simulated network for deterministic alice ↔ b2bua ↔ bob e2e tests. Carries no production code."

[lints]
workspace = true

[dependencies]
b2bua = { path = "../b2bua", features = ["testkit"] }
call = { path = "../call" }
sip-message = { path = "../sip-message" }
sip-net = { path = "../sip-net" }
sip-net-testkit = { path = "../sip-net-testkit" }
sip-txn = { path = "../sip-txn" }
sip-clock = { path = "../sip-clock", features = ["testkit"] }
scenario-harness = { path = "../scenario-harness" }
# `TransportKind::Live` for the `dev_sut` playground binary's real-loopback
# `Harness::with_network_and_clock` (same wiring the loadgen smoke suite uses).
layer-harness = { path = "../layer-harness" }
# `test-util`: the shared `advance` steps the paused test clock.
tokio = { workspace = true, features = ["test-util"] }
# The shared `spawn_proxy_core` LB-SUT primitive (in `src/lib.rs`) is reused by
# both this crate's `tests/common/mod.rs` (single-worker `spawn_lb_proxy`) and
# the `failover-harness` crate (multi-worker `spawn_proxy_inner`), so the
# LoadBalancer `ProxyCore` wiring is a normal dependency, not test-only.
sip-proxy = { path = "../sip-proxy" }
# The `CdrWriter` impl that keeps each terminated `Call` (`src/terminated.rs`).
async-trait = { workspace = true }
# The SUT's default call limiter (`src/limiter/mod.rs`): a real `CallStore` served
# by a `LimiterServer` on the simulated HTTP fabric.
http-net = { path = "../http-net" }
http-net-testkit = { path = "../http-net-testkit" }
call-limiter = { path = "../call-limiter" }
# The node a spawned SUT serves rides its tasks (`observe::spawn_keeping_node`).
observe = { path = "../observe", default-features = false }

[dev-dependencies]
# The closed rule-token list the coverage doc's rows are checked against.
rfc-rules = { path = "../rfc-rules" }
# The call-shape catalog (forked establishments) driven through the SUT.
callshapes = { path = "../callshapes" }
# `catch_unwind` on a future: a cell's failure is collected, the next cell runs.
futures = "0.3"
# The rule vocabulary (`model::Body`) a test-authored rule builds its actions from.
b2bua-sdk = { path = "../b2bua-sdk" }
tokio = { workspace = true, features = ["test-util"] }
# The simulated load sampler a test injects worker readings through.
load-shed = { path = "../load-shed" }
# The one schedule the SUT walks, so a test counts the rungs an RFC class
# owes rather than restating T1/T2 arithmetic (ADR-0032 X1).
sip-retransmit = { path = "../sip-retransmit" }
# Real RTP media through the signalling-only B2BUA. Media flows
# peer-to-peer on a separate simulated fabric to the addresses the SDP (relayed
# by the B2BUA) advertises; the classifier proves it reached the right peer.
media = { path = "../media" }
media-harness = { path = "../media-harness" }
serde_json = { workspace = true }
# The out-of-tree `announcement` callflow service, injected
# into the SUT via `B2buaSut::builder(..).services(..)` for the early-media e2e.
announcement = { path = "../announcement" }

[package]
name = "sip-message"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pure SIP message layer (parse / serialize / strict-validate) — Rust port of sipjsserver src/sip message core."

[lints]
workspace = true

[features]
default = []
# `rvoip-oracle` pulls in rvoip-sip-core as the parity-oracle second impl for
# the compliance matrix. Off by default (production builds never link it);
# enable in CI test runs: `cargo test -p sip-message --features rvoip-oracle`.
rvoip-oracle = ["dep:rvoip-sip-core"]

[dependencies]
rvoip-sip-core = { version = "0.1.26", optional = true }
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
# The message's raw datagram + body are refcounted slices of ONE buffer, so a
# parse (and a forwarding-hop clone) copies no packet bytes. See `sip_str`.
bytes.workspace = true
smallvec.workspace = true

[dev-dependencies]
bytes.workspace = true
proptest.workspace = true
criterion.workspace = true
serde_json.workspace = true
# Counting #[global_allocator] behind `tests/alloc_budget.rs` — the deterministic
# allocs-per-message budget on the parse + proxy-hop paths.
alloc-counter = { path = "../alloc-counter" }

[[bench]]
name = "sip_parser"
harness = false

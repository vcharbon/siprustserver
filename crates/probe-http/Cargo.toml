[package]
name = "probe-http"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The single hand-rolled HTTP probe/metrics server the runner binaries expose on their scrape port, and the loopback-only server of their operator and debug routes. One deep module behind a ProbeRoutes seam: /metrics, /healthz, /readyz (+ /ready alias) driven by an injected 3-valued ProbeState, /fitz; the /debug/heap profile route and, in a build with the `flamegraph` feature, /debug/flamegraph, on loopback only. The hardening (exact-path match, fully-idle connection cut, connection backstop) lives here once."

[package.metadata.purity]
tier = "shell"

[package.metadata.ha]
side = "blind"

[lints]
workspace = true

[dependencies]
# Rides tokio::time directly so the idle-cut is paused-clock controllable.
tokio = { workspace = true }
tracing = { workspace = true }
# The /debug/flamegraph route (pprof sampling -> inferno SVG), feature `flamegraph`.
flamegraph-util = { path = "../flamegraph-util", optional = true }

[features]
# `/debug/flamegraph` captures a CPU flamegraph in-process. Off: the route answers
# `501` and the binary links no profiler, symbolizer or SVG writer. A profiling
# build turns it on through the runner's own `flamegraph` feature; no production
# binary reaches it (`purity.toml`).
flamegraph = ["dep:flamegraph-util"]

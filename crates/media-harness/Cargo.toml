[package]
name = "media-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Test-only media harness — deterministic reference clips, the spectral (MFCC) audio classifier that proves media reached the right peer, and the negotiate_call offer/answer helper. Port of sipjsserver src/test-harness/media/ + tests/media support. Carries no production code (ADR-0004)."

[lints]
workspace = true

[dependencies]
media = { path = "../media" }
sip-net = { path = "../sip-net" }
rustfft = { workspace = true }

[dev-dependencies]
sip-clock = { path = "../sip-clock", features = ["testkit"] }
tokio = { workspace = true, features = ["test-util"] }

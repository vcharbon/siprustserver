[package]
name = "cdr-consumer-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Dedicated CDR consumer: drains the RabbitMQ CDR queue and exposes Prometheus metrics (total CDR count, plus in json mode the summed call duration derived from each record's created_at/terminated_at); optionally ships one cdr-observation.v1 line per CDR to VictoriaLogs for the HA tooling's CDR join. No SIP, no persistence."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "cdr-consumer-runner"
path = "src/main.rs"

[dependencies]
metric-catalogue = { path = "../metric-catalogue" }
# The `/metrics` + `/healthz` server, shared with the runners.
probe-http = { path = "../probe-http" }
# Same AMQP client the b2bua-runner sink publishes with, on the running tokio
# runtime, over a stream amqp-connect connects.
lapin = { workspace = true }
amqp-connect = { path = "../amqp-connect" }
tokio = { workspace = true }
# Only created_at/terminated_at are needed off a JSON CDR; a tiny Deserialize view
# ignores the rest of the record (serde_json skips unknown fields by default),
# so the consumer is decoupled from the full b2bua CdrRecord type.
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = "0.3"
# Process subscriber + lifecycle logging (ADR-0026).
observe = { path = "../observe", features = ["otlp"] }
tracing = { workspace = true }

[dev-dependencies]
# The scripted AMQP 0-9-1 broker the link tests run against
# (tests/it/support/broker.rs): lapin's own frame codec, so the wire is the
# client's.
amq-protocol = { version = "10.6.3", default-features = false }

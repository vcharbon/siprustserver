[package]
name = "call-limiter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Call limiter keyed by the call: the keyed store (per-call multiset + lease, net-of-own-set atomic replace, idempotent release, lease expiry), the wire DTOs of the HTTP API, the HttpService server handler, and its metrics. No b2bua dependency — the client lives in b2bua. Backs a dedicated stateless service shared cluster-wide."

[lints]
workspace = true

[dependencies]
metric-catalogue = { path = "../metric-catalogue" }
http-net = { path = "../http-net" }
sip-clock = { path = "../sip-clock" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
sip-clock = { path = "../sip-clock", features = ["testkit"] }

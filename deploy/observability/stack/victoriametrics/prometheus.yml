# Almost all in-CLUSTER scraping is done by vmagent inside the kind cluster,
# which remote-writes to this VictoriaMetrics instance via the kind docker
# network. One static job keeps VM's own self-metrics.
#
# The sipext load generators (the HA tooling's SIPp and loadgen streams — plain
# docker containers on the no-NAT `sipext` bridge, sipext dual-plane layout)
# are INVISIBLE to the in-cluster vmagent, so this VM scrapes them DIRECTLY:
# the compose file attaches the victoriametrics container to the sipext
# network, and the targets below are the deterministic generator IPs
# (deploy/k8s/lib/net-env.sh: streams at SIPEXT_UAC_BASE_IP .64 + slot, a
# SIPp stream's stat exporter :9035 and a loadgen's :9300 on the stream's IP).
# The range is STATIC on the default SIPEXT_SUBNET (192.168.60.0/25) — change
# it here if you override the subnet. Streams come and go, so most targets are
# down at any instant: that is EXPECTED and must never fail a run (a down
# target simply scrapes nothing).

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "victoriametrics"
    static_configs:
      - targets: ["localhost:8428"]
        labels:
          app: "victoriametrics"

  # SIPp stat exporters on the sipext bridge — generator slots 0..35. The
  # exporter itself labels every series with scenario/role/sipp_job
  # (sipp_stat_exporter.py env), so the dashboards' role= queries need no
  # target labels.
  - job_name: "sipext-sipp-exporter"
    static_configs:
      - targets: [
          "192.168.60.64:9035", "192.168.60.65:9035", "192.168.60.66:9035",
          "192.168.60.67:9035", "192.168.60.68:9035", "192.168.60.69:9035",
          "192.168.60.70:9035", "192.168.60.71:9035", "192.168.60.72:9035",
          "192.168.60.73:9035", "192.168.60.74:9035", "192.168.60.75:9035",
          "192.168.60.76:9035", "192.168.60.77:9035", "192.168.60.78:9035",
          "192.168.60.79:9035", "192.168.60.80:9035", "192.168.60.81:9035",
          "192.168.60.82:9035", "192.168.60.83:9035", "192.168.60.84:9035",
          "192.168.60.85:9035", "192.168.60.86:9035", "192.168.60.87:9035",
          "192.168.60.88:9035", "192.168.60.89:9035", "192.168.60.90:9035",
          "192.168.60.91:9035", "192.168.60.92:9035", "192.168.60.93:9035",
          "192.168.60.94:9035", "192.168.60.95:9035", "192.168.60.96:9035",
          "192.168.60.97:9035", "192.168.60.98:9035", "192.168.60.99:9035",
        ]

  # The hakit runner's loadgen streams (tooling/hakit, `driver: loadgen`): one
  # container per stream at the stream's generator slot, .64 + slot, its
  # /metrics on :9300. A pod-placed stream is scraped in the cluster instead.
  - job_name: "hakit-loadgen"
    static_configs:
      - targets: [
          "192.168.60.64:9300", "192.168.60.65:9300", "192.168.60.66:9300",
          "192.168.60.67:9300", "192.168.60.68:9300", "192.168.60.69:9300",
          "192.168.60.70:9300", "192.168.60.71:9300", "192.168.60.72:9300",
          "192.168.60.73:9300", "192.168.60.74:9300", "192.168.60.75:9300",
          "192.168.60.76:9300", "192.168.60.77:9300", "192.168.60.78:9300",
          "192.168.60.79:9300", "192.168.60.80:9300", "192.168.60.81:9300",
          "192.168.60.82:9300", "192.168.60.83:9300", "192.168.60.84:9300",
          "192.168.60.85:9300", "192.168.60.86:9300", "192.168.60.87:9300",
          "192.168.60.88:9300", "192.168.60.89:9300", "192.168.60.90:9300",
          "192.168.60.91:9300", "192.168.60.92:9300", "192.168.60.93:9300",
          "192.168.60.94:9300", "192.168.60.95:9300", "192.168.60.96:9300",
          "192.168.60.97:9300", "192.168.60.98:9300", "192.168.60.99:9300",
        ]

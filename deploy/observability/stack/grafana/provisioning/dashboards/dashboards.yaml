apiVersion: 1

# Every dashboards/ directory of the HA tooling search path is mounted under
# /hakit/dashboards/<i> (ADR-0049 §7.5); the provider reads them recursively.
providers:
  - name: default
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /hakit/dashboards
      foldersFromFilesStructure: false

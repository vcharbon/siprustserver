# Values of the siprust chart: the SIP front proxy, the B2BUA worker pool, the
# call limiter, the CDR broker and the CDR consumer.
#
# Every object keeps a fixed name (b2bua-worker, sip-front-proxy, call-limiter,
# rabbitmq, cdr-consumer, masq-exempt) and its `app` label, which the tooling
# selects pods by: one release per namespace. A downstream chart that depends
# on this one replaces a runner through `image` + `command`, adds env through
# `env` (by name) and `extraEnv`, and adds sidecars through `extraContainers` /
# `extraVolumes` / `extraVolumeMounts`. Env values are strings, rendered
# through `tpl` (a value may name `{{ .Release.Namespace }}`). A null in
# user-supplied values (-f, --set) removes a default env; Helm keeps a default
# a parent chart's own values.yaml sets to null, so a parent overrides it.
#
# The defaults here leave every runner knob at the runner's own default and
# schedule on any node; the kind lab's settings are values-kind.yaml.

# Read by a parent chart's `condition: siprust.enabled` only.
enabled: true

# Default image of every runner (worker, proxy, call limiter, CDR consumer);
# a component's own `image` overrides it key by key.
image:
  repository: siprustserver
  tag: dev
  pullPolicy: IfNotPresent

# Alpine with iproute2 and iptables: the proxy's vip-loopback init container
# and the masq-exempt DaemonSet.
netToolsImage:
  repository: siprustserver-nettools
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The two SIP planes. Every proxy node owns both VIPs on lo and announces them
# while its proxy is Ready (ADR-0056); the proxy is the only component on both
# planes, and workers reach the world through the internal VIP only. Required
# when the proxy is enabled.
network:
  # Internal VIP (worker-facing).
  proxyVip: ""
  # External VIP (caller-facing) and the node interface of the external
  # plane, which the proxy's readiness requires up (PROXY_EXT_INTERFACE).
  externalVip: ""
  externalInterface: ""
  # The external interface's next hops (IPv4): the external plane's BGP peers,
  # whose BFD and keepalive traffic keeps them resolved. Readiness requires one
  # of them resolved in the node's neighbour table (PROXY_EXT_NEXT_HOPS); equal
  # to proxy.announce.metallb.peers.external when the chart renders MetalLB's
  # objects (refused at render otherwise). Empty checks the interface only.
  externalNextHops: []
  # The external plane's subnet (masq-exempt only).
  externalSubnet: ""
  # UDP port both VIPs listen on.
  sipPort: 5060
  # The proxy's egress face-picker: a destination in these comma-separated
  # CIDRs leaves on the internal face, any other on the external face.
  internalCidrs: ""

# The INVITE transaction bound, seconds (33..=600): the workers' give-up on a
# ringing call (B2BUA_INVITE_TXN_TIMEOUT_SEC) and what the proxy's branch memo
# keeps an INVITE entry for at most, the bound plus Timer H
# (PROXY_INVITE_TXN_TIMEOUT_SEC). One value, so the two never differ; a render
# whose component env states them apart fails. Null keeps the runners' default.
inviteTxnTimeoutSec: null

# Per-call tracing (ADR-0026).
tracing:
  # OTLP/HTTP base the runners export spans to (they append /v1/traces).
  # Empty exports nothing and leaves the sampling machinery inert.
  otlpEndpoint: ""
  # Honour an `X-Trace-Sample` header: a lab setting, since the header is
  # untrusted on a serving edge.
  traceHeader: false

worker:
  # Off leaves a chart of backends only (the RBAC the proxy shares stays).
  enabled: true
  replicas: 2
  image: {}
  command: ["/usr/local/bin/b2bua-runner"]
  args: []
  # B2BUA_DEST: the callee of the scripted decision backend, an IP literal
  # (workers never resolve an external name). Empty leaves the runner default.
  dest: ""
  # The Secret holding the key the workers share to sign the via-extension
  # on their own requests (ADR-0055 §12), key `key` (16 to 64 bytes). The
  # front proxy signs its dead notices to the workers with it (ADR-0050 §3).
  # Required with `replication.enabled`: the chart never draws it, so every
  # render (helm template, GitOps) yields the same pods on the same key.
  clusterKey:
    existingSecret: ""
  # HA call replication (ADR-0011): the changelog on `port`, peers from the
  # EndpointSlices of the headless b2bua-worker Service.
  replication:
    enabled: false
    port: 9092
  # The workers' ingress NetworkPolicy (templates/worker-network-policy.yaml):
  # SIP from the proxies, replication from the other workers, the probe port
  # from `monitoringNamespace` (the kubelet's probes come from the pod's own
  # node, which no NetworkPolicy blocks). Every other ingress is refused.
  # Enforced only by a CNI that implements NetworkPolicy.
  networkPolicy:
    enabled: true
    # The source address the proxy nodes use toward pod IPs, as CIDRs: the
    # proxies are hostNetwork, and their OPTIONS probes and dead notices leave
    # from sockets bound to 0.0.0.0:0, so the kernel picks the source of the
    # route to the worker's pod IP (their calls come from the internal VIP,
    # allowed by the chart). Routed CNI: the node's internal-plane address;
    # overlay (Calico IPIP/VXLAN, flannel): the node's tunnel address. Check
    # `ip route get <worker pod IP>` on each proxy node (`src`). A wrong value
    # makes every proxy read every worker dead. Required while the proxy is
    # enabled; ignored without it (a standalone worker takes SIP from anywhere).
    proxyNodeCidrs: []
    # The namespace of the metrics scraper (siprust-observability's vmagent;
    # the kind lab sets it from OBS_NS).
    monitoringNamespace: observability
  # Env by name over the env the chart derives (pod identity, listen and
  # advertise, metrics, outbound proxy, replication, limiter URL, CDR sink,
  # tracing): a name here overrides a derived one. The failover timings
  # (B2BUA_REPL_NOOP_INTERVAL_MS, _IDLE_TIMEOUT_MS, _ACK_BOUND_MS,
  # _CANCEL_BOUND_MS, B2BUA_DEAD_NOTICE_FRESH_MS, B2BUA_DEAD_VERDICT_HOLD_MS)
  # and the event-queue gate (B2BUA_EVENT_QUEUE_*) are set here; their roles, defaults and relations are the b2bua-runner
  # configuration reference (crates/b2bua-runner/src/main.rs).
  env: {}
  # EnvVar entries appended after `env` (valueFrom and the like).
  extraEnv: []
  # Container ports added to the worker container.
  extraPorts: []
  extraVolumeMounts: []
  extraVolumes: []
  # Sidecar containers of the worker pod.
  extraContainers: []
  extraInitContainers: []
  # Over the chart's prometheus.io annotations, key by key.
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  # Namespaced sysctls of the pod (spec.securityContext.sysctls).
  sysctls: []
  priorityClassName: ""
  # Above the drain's longest run, B2BUA_DRAIN_GRACE_MS + 2 ×
  # B2BUA_DRAIN_RELEASE_FLUSH_MS + B2BUA_DRAIN_CDR_FLUSH_MS + 2 s (refused at
  # render otherwise; templates/checks.yaml holds every render-time relation).
  terminationGracePeriodSeconds: 30
  # Voluntary disruptions (a node drain, an eviction) take one worker at a
  # time; a returned worker counts until it reads ready, its backups held.
  podDisruptionBudget: { enabled: true, maxUnavailable: 1 }
  resources:
    requests: { cpu: "250m", memory: "128Mi" }
    limits: { memory: "2Gi" }
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # A primary and its backup on different nodes when the nodes allow it.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector: { matchLabels: { app: b2bua-worker } }

proxy:
  enabled: true
  replicas: 2
  image: {}
  command: ["/usr/local/bin/sip-proxy-runner"]
  args: []
  # PROXY_RECV_SHARDS: SO_REUSEPORT recv sockets, one serial core task each.
  # Null keeps the runner default.
  recvShards: null
  # The self-gate's CPS token bucket: refill per second and capacity. Null
  # keeps the runner default.
  selfGate:
    cpsRate: null
    cpsSize: null
  # The stickiness-cookie signing key both proxies share (ADR-0046), keys
  # `kid` and `key`, in the Secret `existingSecret` names; required, so every
  # render (helm template, GitOps) yields the same pods on the same key.
  # `drawInCluster` (a release installed against its cluster only, the kind
  # lab): with no `existingSecret` the chart keeps one Secret
  # (sip-front-proxy-hmac) whose key is drawn on the first install and read
  # back by every upgrade; `kid` applies to that first draw only. Changing
  # the key 403s the in-dialog requests of calls in progress.
  hmac:
    existingSecret: ""
    drawInCluster: false
    kid: k1
  # Per-neighbour bound of the unresolved ARP queue in the proxy node's
  # network namespace (ADR-0033), set by the vip-loopback init container.
  unresQlenBytes: 16384
  # The readiness probe the node's announcement follows (ADR-0056):
  # periodSeconds × failureThreshold bounds how long a failing proxy stays
  # announced before the withdrawal starts.
  readinessProbe:
    periodSeconds: 1
    failureThreshold: 2
  # A replaced pod counts as available this long after Ready: above one probe
  # period + announce.propagationMs, so a rollout stops the next proxy only
  # once the replaced one is back in the routers' tables (refused at render
  # otherwise). Set from the lab's measured Ready-to-announced latency (6.7 s,
  # kube-proxy iptables mode) plus margin, pending the nftables run.
  minReadySeconds: 12
  # The BGP announcement of the VIPs (ADR-0056): one announce-only
  # LoadBalancer Service per VIP (templates/proxy-announce.yaml).
  announce:
    # The one TCP port of each Service; nothing listens on it on a proxy node.
    # Never the metrics port: kube-proxy would expose it on the VIP.
    port: 9
    # The Services' loadBalancerClass, for a cluster that runs several
    # load-balancer implementations; null leaves it unset.
    loadBalancerClass: null
    # The latency from a readiness change to the routers' tables (EndpointSlice,
    # speaker, BGP UPDATE, router FIB), ms. The render requires the drain grace
    # and minReadySeconds above it plus the probe's detection. Measured on the
    # lab, 6.8 s with kube-proxy in iptables mode, pending the nftables run.
    propagationMs: 7000
    # The MetalLB objects of the announcement, rendered into MetalLB's
    # namespace: an IPAddressPool per VIP (autoAssign off), a BGPAdvertisement
    # per pool to that face's peers only, a BGPPeer per router from the proxy
    # nodes (proxy.nodeSelector), one BFDProfile, no graceful restart. Off
    # leaves them to the cluster's operator. On needs MetalLB's CRDs in the
    # cluster (helm template: --api-versions metallb.io/v1beta1
    # --api-versions metallb.io/v1beta2).
    metallb:
      enabled: false
      namespace: metallb-system
      # The proxy nodes' AS number.
      myASN: 64513
      # The routers of each plane, each `{name, address, asn}`; required when
      # enabled.
      peers:
        internal: []
        external: []
      # BFD: a router reads a node dead after detectMultiplier ×
      # receiveIntervalMs without its packets.
      bfd:
        receiveIntervalMs: 300
        transmitIntervalMs: 300
        detectMultiplier: 3
  env: {}
  extraEnv: []
  extraPorts: []
  extraVolumeMounts: []
  extraVolumes: []
  # Sidecar containers of the proxy pod, on the node's network (hostNetwork):
  # the place of a component on the external plane, such as a media relay.
  extraContainers: []
  extraInitContainers: []
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  sysctls: []
  priorityClassName: ""
  # Above PROXY_DRAIN_GRACE_MS + 2 s (refused at render otherwise).
  terminationGracePeriodSeconds: 30
  # Voluntary disruptions take one proxy at a time.
  podDisruptionBudget: { enabled: true, maxUnavailable: 1 }
  resources:
    requests: { cpu: "500m", memory: "64Mi" }
    limits: { memory: "512Mi" }
  # The nodes the proxies run on, required: the workers are kept off every
  # node these labels name (ADR-0056), so a node that runs or ran a proxy,
  # whose VIPs stay on its lo, never takes a worker.
  nodeSelector: {}
  tolerations: []

callLimiter:
  enabled: true
  image: {}
  command: ["/usr/local/bin/call-limiter-runner"]
  args: []
  # LIMITER_LEASE_SECONDS, the lease every admit and refresh answer states
  # (ADR-0040). Null keeps the runner default.
  leaseSeconds: null
  env: {}
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []
  extraContainers: []
  podAnnotations: {}
  podLabels: {}
  securityContext: {}
  # The runner exits on SIGTERM; the grace only bounds a process that does not.
  terminationGracePeriodSeconds: 2
  resources:
    requests: { cpu: "100m", memory: "32Mi" }
    limits: { memory: "256Mi" }
  nodeSelector: {}
  tolerations: []

# The CDR transport: one record per terminated call, worker -> RabbitMQ ->
# consumer.
cdr:
  enabled: true
  queue: cdr
  # x-max-length (drop-head) of the queue. Producer and consumer declare the
  # queue with the same arguments, so the chart states it for both.
  maxLength: 100000
  rabbitmq:
    image:
      repository: rabbitmq
      tag: 3.13-management
      pullPolicy: IfNotPresent
    user: guest
    password: guest
    podAnnotations: {}
    # The store lives on a memory-backed emptyDir counted in the memory limit.
    storeSizeLimit: 512Mi
    resources:
      requests: { cpu: "200m", memory: "256Mi" }
      limits: { memory: "1Gi" }
    nodeSelector: {}
    tolerations: []
  consumer:
    enabled: true
    image: {}
    command: ["/usr/local/bin/cdr-consumer-runner"]
    args: []
    # `json` sums the workers' JSON records; `opaque` counts deliveries of any
    # format.
    payload: json
    # `http://host:port` of the VictoriaLogs the consumer ships one
    # cdr-observation.v1 line per CDR to (the HA tooling's CDR join); empty
    # ships none.
    observationUrl: ""
    env: {}
    extraEnv: []
    extraVolumeMounts: []
    extraVolumes: []
    extraContainers: []
    podAnnotations: {}
    podLabels: {}
    resources:
      requests: { cpu: "50m", memory: "32Mi" }
      limits: { memory: "128Mi" }
    nodeSelector: {}
    tolerations: []

# kindnetd's KIND-MASQ-AGENT chain masquerades everything outside the pod
# CIDR; this DaemonSet keeps the VIPs and the external subnet out of it and
# drops a packet for the internal VIP arriving on the external interface
# (ADR-0048). kind clusters only.
masqExempt:
  enabled: false
  periodSeconds: 15
  resources:
    requests: { cpu: "10m", memory: "8Mi" }
    limits: { memory: "32Mi" }

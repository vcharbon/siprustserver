{{- if and .Values.proxy.enabled .Values.proxy.hmac.drawInCluster (not .Values.proxy.hmac.existingSecret) }}
{{- /*
The cookie signing key both proxies share (ADR-0046), drawn in the cluster
only where `proxy.hmac.drawInCluster` allows it (templates/checks.yaml). Drawn once: an upgrade
reads the live Secret back and keeps its kid and key; `keep` leaves it in
place across an uninstall, so a reinstall under the same release adopts it.
*/}}
{{- $live := lookup "v1" "Secret" .Release.Namespace "sip-front-proxy-hmac" }}
apiVersion: v1
kind: Secret
metadata:
  name: sip-front-proxy-hmac
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "siprust.labels" (dict "root" $ "app" "sip-front-proxy") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $live $live.data }}
  kid: {{ $live.data.kid }}
  key: {{ $live.data.key }}
  {{- else }}
  kid: {{ .Values.proxy.hmac.kid | b64enc }}
  key: {{ randBytes 32 | b64enc }}
  {{- end }}
{{- end }}

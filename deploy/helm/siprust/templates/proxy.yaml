{{- if .Values.proxy.enabled }}
{{- /*
SIP front proxy and load balancer, an active-active pair on the nodes of
both SIP planes (ADR-0056). Each pod binds the internal VIP (worker-facing)
and the external VIP (caller-facing) on its node's lo; the node announces
both to the routers through the announce-only Services (proxy-announce.yaml)
exactly while the pod is Ready, and the routers spread flows over the
announcing nodes. The proxy advertises the VIPs in Via and Record-Route,
the same from either pod; the HMAC stickiness cookie and worker replication
keep in-dialog routing correct from either pod (ADR-0009 X7). Workers are
discovered from the EndpointSlices of the headless b2bua-worker Service
(ADR-0012 D4).
*/}}
{{- $p := .Values.proxy }}
{{- $vip := include "siprust.net" (dict "root" $ "key" "proxyVip") }}
{{- $extVip := include "siprust.net" (dict "root" $ "key" "externalVip") }}
{{- $port := int .Values.network.sipPort }}
{{- $env := dict
  "PROXY_LISTEN" (printf "%s:%d" $vip $port)
  "PROXY_ADVERTISE" (printf "%s:%d" $vip $port)
  "PROXY_LISTEN_EXT" (printf "%s:%d" $extVip $port)
  "PROXY_ADVERTISE_EXT" (printf "%s:%d" $extVip $port)
  "PROXY_EXT_INTERFACE" (include "siprust.net" (dict "root" $ "key" "externalInterface"))
  "PROXY_METRICS" "0.0.0.0:9090"
  "PROXY_WORKER_SERVICE" "b2bua-worker"
  "PROXY_WORKER_PORT" "5060"
  "OTEL_EXPORTER_OTLP_ENDPOINT" .Values.tracing.otlpEndpoint
  "SIP_TRACE_HEADER" (include "siprust.traceHeader" .)
}}
{{- $_ := set $env "PROXY_EXT_NEXT_HOPS" (join "," .Values.network.externalNextHops) }}
{{- if not (kindIs "invalid" .Values.inviteTxnTimeoutSec) }}
{{- $_ := set $env "PROXY_INVITE_TXN_TIMEOUT_SEC" (toString (int .Values.inviteTxnTimeoutSec)) }}
{{- end }}
{{- if not (kindIs "invalid" $p.recvShards) }}
{{- $_ := set $env "PROXY_RECV_SHARDS" (toString (int $p.recvShards)) }}
{{- end }}
{{- if not (kindIs "invalid" $p.selfGate.cpsRate) }}
{{- $_ := set $env "PROXY_SELF_GATE_CPS_RATE" (toString (int $p.selfGate.cpsRate)) }}
{{- end }}
{{- if not (kindIs "invalid" $p.selfGate.cpsSize) }}
{{- $_ := set $env "PROXY_SELF_GATE_CPS_SIZE" (toString (int $p.selfGate.cpsSize)) }}
{{- end }}
{{- include "siprust.overlayEnv" (dict "into" $env "from" $p.env) }}
{{- /* Sizing's computed values (templates/_sizing.tpl): checks.yaml refuses
an env or a self-gate stating one of them; the computed memory replaces the
resources'. */ -}}
{{- $sizing := include "siprust.sizing" .Values | fromJson }}
{{- $resources := deepCopy ($p.resources | default dict) }}
{{- with $sizing.proxyEnv }}
{{- include "siprust.overlayEnv" (dict "into" $env "from" .) }}
{{- $_ := set $resources "requests" (merge (dict "memory" $sizing.proxyMemory) (get $resources "requests" | default dict)) }}
{{- $_ := set $resources "limits" (merge (dict "memory" $sizing.proxyMemory) (get $resources "limits" | default dict)) }}
{{- end }}
{{- $hmacSecret := $p.hmac.existingSecret | default "sip-front-proxy-hmac" }}
{{- $clusterKeySecret := "" }}
{{- if .Values.worker.replication.enabled }}
{{- $clusterKeySecret = required "worker.clusterKey.existingSecret: replication needs the Secret of the workers' shared key (ADR-0055 §12)" .Values.worker.clusterKey.existingSecret }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sip-front-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "siprust.labels" (dict "root" $ "app" "sip-front-proxy") | nindent 4 }}
spec:
  replicas: {{ int $p.replicas }}
  selector:
    matchLabels: { app: sip-front-proxy }
  # The pods are hard anti-affine, one per node: a rollout replaces one pod at
  # a time, and a replaced pod counts as available only minReadySeconds after
  # Ready, once its node is back in the routers' tables, so the next pod is
  # stopped only then (templates/checks.yaml).
  minReadySeconds: {{ int $p.minReadySeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  template:
    metadata:
      labels:
        {{- include "siprust.podLabels" (dict "app" "sip-front-proxy" "extra" $p.podLabels) | nindent 8 }}
      annotations:
        {{- $base := dict "prometheus.io/scrape" "true" "prometheus.io/port" "9090" }}
        {{- if $p.routeGuard.enabled }}
        {{- $_ := set $base "prometheus.io/sidecar-port" (toString (int $p.routeGuard.metricsPort)) }}
        {{- end }}
        {{- include "siprust.podAnnotations" (dict "base" $base "extra" $p.podAnnotations) | nindent 8 }}
    spec:
      serviceAccountName: sip-front-proxy
      {{- with include "siprust.pullSecrets" . | trim }}{{ . | nindent 6 }}{{- end }}
      {{- with include "siprust.scheduling" $p | trim }}{{ . | nindent 6 }}{{- end }}
      {{- with include "siprust.podSecurity" $p | trim }}{{ . | nindent 6 }}{{- end }}
      terminationGracePeriodSeconds: {{ int $p.terminationGracePeriodSeconds }}
      # The VIPs are the node's own addresses on lo: every face binds and
      # sources its egress from them.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: sip-front-proxy } }
              topologyKey: kubernetes.io/hostname
            # No worker on a proxy node: the VIPs sit on its lo for good, so a
            # worker there would reach its local proxy whatever the routers
            # announce (ADR-0056). Required anti-affinity holds both ways: a
            # worker is not scheduled onto a proxy's node either.
            - labelSelector: { matchLabels: { app: b2bua-worker } }
              topologyKey: kubernetes.io/hostname
      initContainers:
        {{- if $p.routeGuard.enabled }}
        # The node starts withdrawn: its BFD and BGP to the routers stay
        # dropped until the route guard reads the proxy fit for the hold, so
        # an EndpointSlice still naming the pod Ready from before a node
        # restart announces nothing.
        - name: route-guard-hold
          {{- include "siprust.image" (dict "root" $ "image" $p.image) | nindent 10 }}
          command: ["/usr/local/bin/route-guard", "--withdraw"]
          env:
            {{- include "siprust.routeGuardEnv" . | nindent 12 }}
          securityContext:
            {{- include "siprust.routeGuardSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $p.routeGuard.resources | nindent 12 }}
        {{- end }}
        - name: vip-loopback
          {{- include "siprust.netToolsImage" . | nindent 10 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- .Files.Get "files/vip-loopback.sh" | nindent 14 }}
          env:
            - { name: PROXY_VIP, value: {{ $vip | quote }} }
            - { name: EXTERNAL_VIP, value: {{ $extVip | quote }} }
            - { name: EXTERNAL_INTERFACE, value: {{ include "siprust.net" (dict "root" $ "key" "externalInterface") | quote }} }
            - { name: UNRES_QLEN_BYTES, value: {{ int $p.unresQlenBytes | toString | quote }} }
            - { name: NEIGH_BASE_REACHABLE_TIME_MS, value: {{ int $p.neighbour.baseReachableTimeMs | toString | quote }} }
            - { name: NEIGH_DELAY_FIRST_PROBE_S, value: {{ int $p.neighbour.delayFirstProbeSeconds | toString | quote }} }
            - { name: NEIGH_UCAST_SOLICIT, value: {{ int $p.neighbour.ucastSolicit | toString | quote }} }
            - { name: NEIGH_MCAST_SOLICIT, value: {{ int $p.neighbour.mcastSolicit | toString | quote }} }
            - { name: NEIGH_RETRANS_TIME_MS, value: {{ int $p.neighbour.retransTimeMs | toString | quote }} }
            - { name: ROUTE_GUARD, value: {{ ternary "on" "off" $p.routeGuard.enabled | quote }} }
          securityContext:
            privileged: true
            capabilities: { add: ["NET_ADMIN"] }
        {{- with $p.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: sip-front-proxy
          {{- include "siprust.image" (dict "root" $ "image" $p.image) | nindent 10 }}
          command: {{ toJson $p.command }}
          {{- with $p.args }}
          args: {{ toJson . }}
          {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: PROXY_HMAC_KID
              valueFrom: { secretKeyRef: { name: {{ $hmacSecret }}, key: kid } }
            - name: PROXY_HMAC_KEY
              valueFrom: { secretKeyRef: { name: {{ $hmacSecret }}, key: key } }
            {{- with $clusterKeySecret }}
            # The workers' shared key the dead notice is signed with (ADR-0050 §3).
            - name: PROXY_CLUSTER_KEY
              valueFrom: { secretKeyRef: { name: {{ . }}, key: key } }
            {{- end }}
            {{- with include "siprust.envMap" (dict "root" $ "env" $env) | trim }}{{ . | nindent 12 }}{{- end }}
            {{- with $p.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # containerPort is a label under hostNetwork: the bind is PROXY_LISTEN.
          ports:
            - { name: sip, containerPort: 5060, protocol: UDP }
            - { name: metrics, containerPort: 9090, protocol: TCP }
            {{- with $p.extraPorts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Ready from the first worker view on with >=1 routable worker and the
          # external face usable (ADR-0012 D4, ADR-0050 §11, ADR-0056); the
          # node announces the VIPs exactly while it is Ready, so the period
          # and threshold bound the withdrawal (templates/checks.yaml).
          # Liveness: process up and every recv shard turning (ADR-0046 D4),
          # never the worker view, so a proxy that boots with no reachable
          # worker is not restarted; an idle shard is never stalled.
          readinessProbe:
            httpGet: { path: /readyz, port: 9090 }
            initialDelaySeconds: 1
            periodSeconds: {{ int $p.readinessProbe.periodSeconds }}
            failureThreshold: {{ int $p.readinessProbe.failureThreshold }}
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            httpGet: { path: /healthz, port: 9090 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml $resources | nindent 12 }}
          {{- with $p.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if $p.routeGuard.enabled }}
        {{- $g := $p.routeGuard }}
        # The route guard (ADR-0056 §10): reads /fitz over loopback and drops
        # the node's BFD and BGP to the routers while the proxy is unfit, hung
        # or gone, so they withdraw the node within their BFD detection time.
        # The pod's only NET_ADMIN after its init container.
        - name: route-guard
          {{- include "siprust.image" (dict "root" $ "image" $p.image) | nindent 10 }}
          command: ["/usr/local/bin/route-guard"]
          env:
            {{- include "siprust.routeGuardEnv" . | nindent 12 }}
          ports:
            - { name: guard-metrics, containerPort: {{ int $g.metricsPort }}, protocol: TCP }
          # Ready exactly while the guard lets the node out, so the pod is
          # Ready, and minReadySeconds counts, only from a node that carries
          # traffic.
          readinessProbe:
            httpGet: { path: /readyz, port: {{ int $g.metricsPort }} }
            periodSeconds: {{ int $p.readinessProbe.periodSeconds }}
            failureThreshold: {{ int $p.readinessProbe.failureThreshold }}
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            httpGet: { path: /healthz, port: {{ int $g.metricsPort }} }
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            {{- include "siprust.routeGuardSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $g.resources | nindent 12 }}
        {{- end }}
        # The external next hops in the table of the external VIP's traffic
        # (ADR-0056 §11). Ready while the table holds one: a pod whose table is
        # empty stays out of Ready, across a restart of this container too.
        - name: egress-routes
          {{- include "siprust.netToolsImage" . | nindent 10 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- .Files.Get "files/vip-egress-routes.sh" | nindent 14 }}
          env:
            - { name: EXTERNAL_INTERFACE, value: {{ include "siprust.net" (dict "root" $ "key" "externalInterface") | quote }} }
            - { name: EXTERNAL_NEXT_HOPS, value: {{ join " " .Values.network.externalNextHops | quote }} }
            - { name: PERIOD, value: {{ int $p.egressRoutes.periodSeconds | toString | quote }} }
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "ip -o route show table 5060 default | grep -q ' via '"]
            periodSeconds: {{ int $p.readinessProbe.periodSeconds }}
            failureThreshold: 1
            successThreshold: 1
            timeoutSeconds: 1
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"], add: ["NET_ADMIN"] }
          resources:
            {{- toYaml $p.egressRoutes.resources | nindent 12 }}
        {{- with $p.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $p.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Metrics-only Service: SIP flows through the VIPs the nodes announce.
apiVersion: v1
kind: Service
metadata:
  name: sip-front-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "siprust.labels" (dict "root" $ "app" "sip-front-proxy") | nindent 4 }}
spec:
  selector: { app: sip-front-proxy }
  ports:
    - { name: metrics, port: 9090, targetPort: 9090, protocol: TCP }
{{- end }}

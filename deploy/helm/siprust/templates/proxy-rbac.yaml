{{- if .Values.proxy.enabled }}
{{- /* The proxy discovers the worker pool through the worker's EndpointSlice reader Role (ADR-0012 D4). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sip-front-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "siprust.labels" (dict "root" $ "app" "sip-front-proxy") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sip-front-proxy-endpointslice-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "siprust.labels" (dict "root" $ "app" "sip-front-proxy") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: sip-front-proxy
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: b2bua-endpointslice-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}

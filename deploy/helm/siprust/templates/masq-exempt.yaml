{{- if .Values.masqExempt.enabled }}
{{- /* Keeps the SIP planes out of kindnetd's masquerade, on every node but the tainted infra one. */}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: masq-exempt
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "siprust.labels" (dict "root" $ "app" "masq-exempt") | nindent 4 }}
spec:
  selector:
    matchLabels: { app: masq-exempt }
  template:
    metadata:
      labels:
        app: masq-exempt
    spec:
      hostNetwork: true
      {{- with include "siprust.pullSecrets" . | trim }}{{ . | nindent 6 }}{{- end }}
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      containers:
        - name: masq-exempt
          {{- include "siprust.keepalivedImage" . | nindent 10 }}
          securityContext:
            capabilities: { add: ["NET_ADMIN", "NET_RAW"] }
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- .Files.Get "files/masq-exempt.sh" | nindent 14 }}
          env:
            - { name: PROXY_VIP, value: {{ include "siprust.net" (dict "root" $ "key" "proxyVip") | quote }} }
            - { name: EXTERNAL_VIP, value: {{ include "siprust.net" (dict "root" $ "key" "externalVip") | quote }} }
            - { name: EXTRA_VIPS, value: {{ include "siprust.extraVips" . | quote }} }
            - { name: EXTERNAL_SUBNET, value: {{ include "siprust.net" (dict "root" $ "key" "externalSubnet") | quote }} }
            - { name: EXTERNAL_INTERFACE, value: {{ include "siprust.net" (dict "root" $ "key" "externalInterface") | quote }} }
            - { name: PERIOD, value: {{ int .Values.masqExempt.periodSeconds | toString | quote }} }
          resources:
            {{- toYaml .Values.masqExempt.resources | nindent 12 }}
{{- end }}

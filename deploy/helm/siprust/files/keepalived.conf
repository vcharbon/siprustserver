{{- $vip := include "siprust.net" (dict "root" $ "key" "proxyVip") -}}
{{- $extVip := include "siprust.net" (dict "root" $ "key" "externalVip") -}}
{{- $if := include "siprust.net" (dict "root" $ "key" "internalInterface") -}}
{{- $extIf := include "siprust.net" (dict "root" $ "key" "externalInterface") -}}
# Rendered by the siprust chart (files/keepalived.conf).
#
# Identical on both pods, same base priority. state BACKUP: the first pod up
# wins the VIPs; VRRP preempts only on a strictly higher priority, so the
# holder keeps them across its peer's reboots. Multicast VRRP: the node bridge
# floods 224.0.0.18 between the edge nodes.
#
# ONE vrrp_instance owns both identities, the internal VIP on the internal
# interface and the external VIP on the external one: one election, adverts on
# the internal plane, so the two faces never split across pods.
# track_interface drives the instance to FAULT when the external interface
# disappears, so the peer takes both VIPs together.
#
# The VIPs follow proxy health (ADR-0046): chk_proxy_health GETs the proxy's
# /healthz, weighted, never a FAULT trigger. 3 failures in a row drop this
# node's priority by 50, so a dead proxy hands the VIPs to a healthy peer;
# both failing leaves the priorities equal and the VIPs where they are; a
# recovered proxy is back at the same priority and does not take them back.
# init_fail: a starting keepalived sits at the lowered priority until its
# proxy passes `rise 2`. The check is clamped to exit 0/1, so an exec failure
# reads as one failed check.
#
# A move takes 4.6-6.6 s: d + 2*interval + master_down - e, d in (0, 1] the
# check's phase, master_down = 3*advert_int + (256-100)/256 = 3.609 s, e in
# [0, 1) the age of the last full-priority advert at the drop.
global_defs {
    router_id sip-front-proxy
    script_user root
}
vrrp_script chk_proxy_health {
    script "/bin/sh -c 'wget -q -T 1 -O /dev/null http://127.0.0.1:9090/healthz && exit 0; exit 1'"
    interval 1
    timeout 1
    fall 3
    rise 2
    weight -50
    init_fail
}
vrrp_instance VI_SIP {
    state BACKUP
    interface {{ $if }}
    virtual_router_id {{ int .Values.proxy.virtualRouterId }}
    priority 100
    # VRRPv2 adverts are whole seconds.
    advert_int 1
    # A gratuitous-ARP burst at election is lost while a fresh bridge's FDB
    # settles: repeat it, and refresh the claim so a stale neighbour binding
    # heals within garp_master_refresh seconds, per address on both planes.
    garp_master_delay 1
    garp_master_repeat 5
    garp_master_refresh 10
    garp_master_refresh_repeat 2
    virtual_ipaddress {
        {{ $vip }} dev {{ $if }}
        {{ $extVip }} dev {{ $extIf }}
    }
    track_interface {
        {{ $extIf }}
    }
    track_script {
        chk_proxy_health
    }
    # Both VIPs stay on lo at all times, so either pod binds them and sources
    # its egress from them.
    notify_master "/bin/sh -c 'ip addr add {{ $vip }}/32 dev lo 2>/dev/null; ip addr add {{ $extVip }}/32 dev lo 2>/dev/null; true'"
    notify_backup "/bin/sh -c 'ip addr add {{ $vip }}/32 dev lo 2>/dev/null; ip addr add {{ $extVip }}/32 dev lo 2>/dev/null; true'"
    notify_fault  "/bin/sh -c 'ip addr add {{ $vip }}/32 dev lo 2>/dev/null; ip addr add {{ $extVip }}/32 dev lo 2>/dev/null; true'"
}

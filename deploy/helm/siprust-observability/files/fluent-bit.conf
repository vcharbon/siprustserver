[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Path              /var/log/containers/*.log
    Path_Key          file
    Exclude_Path      {{ join "," .Values.logShipping.excludePaths }}
    multiline.parser  docker, cri
    Tag               kube.*
    Refresh_Interval  5
    Skip_Long_Lines   On
    DB                /var/log/fluent-bit-tail.db

# The metadata cache is keyed by pod name; Cache_Use_Docker_Id fetches it
# again for a new container, so a restarted container or a pod re-created
# under the same name carries its own docker_id and pod_id.
[FILTER]
    Name                kubernetes
    Match               kube.*
    Cache_Use_Docker_Id On
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Merge_Log           On
    Keep_Log            Off
    K8S-Logging.Parser  On
    K8S-Logging.Exclude On

# VictoriaLogs flattens the nested `kubernetes` map into dotted field
# names; the stream fields name them so, one stream per container output.
[OUTPUT]
    Name              http
    Match             kube.*
    Host              {{ include "obs.host" . }}
    Port              {{ int .Values.hostStack.logsPort }}
    URI               /insert/jsonline?_stream_fields=stream,kubernetes.pod_name,kubernetes.namespace_name,kubernetes.container_name&_msg_field=log&_time_field=date
    Format            json_lines
    Json_date_format  iso8601
    Json_date_key     date
    compress          gzip


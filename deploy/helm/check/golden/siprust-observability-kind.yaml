    app.kubernetes.io/part-of: siprust-observability
    helm.sh/chart: siprust-observability-0.1.0
  name: kube-state-metrics
  namespace: observability
spec:
  ports:
  - name: http-metrics
    port: 8080
    targetPort: 8080
  selector:
    app: kube-state-metrics

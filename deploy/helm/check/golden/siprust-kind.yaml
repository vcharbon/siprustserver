apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: sip-front-proxy
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sip-front-proxy
    app.kubernetes.io/part-of: siprust

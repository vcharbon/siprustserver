apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sip-front-proxy
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sip-front-proxy
    app.kubernetes.io/part-of: siprust
    helm.sh/chart: siprust-0.1.0
  name: sip-front-proxy
  namespace: sip-test
spec:
  minReadySeconds: 12
  replicas: 2
  selector:
    matchLabels:
      app: sip-front-proxy
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/port: '9090'
        prometheus.io/scrape: 'true'
      labels:
        app: sip-front-proxy
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: sip-front-proxy
            topologyKey: kubernetes.io/hostname
          - labelSelector:
              matchLabels:
                app: b2bua-worker
            topologyKey: kubernetes.io/hostname
      containers:
      - command:
        - /usr/local/bin/sip-proxy-runner
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PROXY_HMAC_KID
          valueFrom:
            secretKeyRef:
              key: kid
              name: sip-front-proxy-hmac
        - name: PROXY_HMAC_KEY
          valueFrom:
            secretKeyRef:
              key: key
              name: sip-front-proxy-hmac
        - name: PROXY_CLUSTER_KEY
          valueFrom:
            secretKeyRef:
              key: key
              name: b2bua-worker-cluster-key
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://172.20.0.1:10428/insert/opentelemetry
        - name: PROXY_ADVERTISE
          value: 172.20.255.250:5060
        - name: PROXY_ADVERTISE_EXT
          value: 192.168.60.250:5060
        - name: PROXY_EXT_INTERFACE
          value: eth1
        - name: PROXY_EXT_NEXT_HOPS
          value: 192.168.60.1
        - name: PROXY_FACE_INT_CIDRS
          value: 10.244.0.0/16,172.20.0.0/17
        - name: PROXY_LISTEN
          value: 172.20.255.250:5060
        - name: PROXY_LISTEN_EXT
          value: 192.168.60.250:5060
        - name: PROXY_METRICS
          value: 0.0.0.0:9090
        - name: PROXY_UDP_RCVBUF
          value: '4194304'
        - name: PROXY_UDP_SNDBUF
          value: '4194304'
        - name: PROXY_WORKER_PORT
          value: '5060'
        - name: PROXY_WORKER_SERVICE
          value: b2bua-worker
        - name: SIP_TRACE_HEADER
          value: '1'
        - name: _RJEM_MALLOC_CONF
          value: dirty_decay_ms:1000,muzzy_decay_ms:1000
        image: siprustserver:dev
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 3
          periodSeconds: 10
        name: sip-front-proxy
        ports:
        - containerPort: 5060
          name: sip
          protocol: UDP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /readyz
            port: 9090
          initialDelaySeconds: 1
          periodSeconds: 1
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 64Mi
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      initContainers:
      - args:
        - "#!/bin/sh\n# The proxy pod's init container, on the node's network namespace\n\
          # (hostNetwork). Reads PROXY_VIP, EXTERNAL_VIP and UNRES_QLEN_BYTES from\
          \ its\n# env; the chart never rewrites this text.\n#\n# Both VIPs go on\
          \ lo before the proxy starts: the node owns them for good and\n# the routers\
          \ reach them through the node's announcement (ADR-0056). Strict\n# ARP keeps\
          \ lo's addresses off every neighbour table: the VIPs are routed,\n# never\
          \ ARP-answered.\n#\n# A packet for a VIP that reaches the node while no\
          \ proxy socket is bound\n# (the window before the node's route is withdrawn)\
          \ would draw an ICMP port\n# unreachable, which a SIP UAC treats as a transport\
          \ error (RFC 3261 \xA718.4)\n# instead of retransmitting into the peer's\
          \ path: those are dropped.\n#\n# A next hop the kernel cannot resolve holds\
          \ every datagram sent to it on the\n# neighbour's unresolved queue, charged\
          \ to the sending socket, for the whole\n# ARP cycle (ADR-0033). The default\
          \ bound equals a default socket send buffer;\n# UNRES_QLEN_BYTES bounds\
          \ it per neighbour on every interface. net.core.wmem_max\n# is the host's\
          \ and read-only here (the host preflight raises it).\nset -e\nfor vip in\
          \ $PROXY_VIP $EXTERNAL_VIP; do\n  ip addr add \"$vip/32\" dev lo 2>/dev/null\
          \ || ip addr show dev lo | grep -q \"$vip/32\"\n  iptables -C OUTPUT -s\
          \ \"$vip/32\" -p icmp --icmp-type port-unreachable -j DROP 2>/dev/null \\\
          \n    || iptables -I OUTPUT 1 -s \"$vip/32\" -p icmp --icmp-type port-unreachable\
          \ -j DROP\ndone\necho 1 > /proc/sys/net/ipv4/conf/all/arp_ignore\necho 2\
          \ > /proc/sys/net/ipv4/conf/all/arp_announce\necho 1 > /proc/sys/net/ipv4/conf/lo/arp_ignore\n\
          echo 2 > /proc/sys/net/ipv4/conf/lo/arp_announce\nfor f in /proc/sys/net/ipv4/neigh/*/unres_qlen_bytes;\
          \ do\n  echo \"$UNRES_QLEN_BYTES\" > \"$f\" || echo \"vip-loopback: WARN\
          \ could not set $f\"\ndone\necho \"vip-loopback: $PROXY_VIP $EXTERNAL_VIP\
          \ on lo + strict ARP + no ICMP port unreachable from them + neigh unres_qlen_bytes=$UNRES_QLEN_BYTES\
          \ ready\"\n"
        command:
        - /bin/sh
        - -c
        env:
        - name: PROXY_VIP
          value: 172.20.255.250
        - name: EXTERNAL_VIP
          value: 192.168.60.250
        - name: UNRES_QLEN_BYTES
          value: '16384'
        image: siprustserver-nettools:dev
        imagePullPolicy: IfNotPresent
        name: vip-loopback
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
          privileged: true
      nodeSelector:
        tier: edge
      serviceAccountName: sip-front-proxy
      terminationGracePeriodSeconds: 30
---

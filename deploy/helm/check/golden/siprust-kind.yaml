apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: masq-exempt
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: masq-exempt
    app.kubernetes.io/part-of: siprust
    helm.sh/chart: siprust-0.1.0
  name: masq-exempt
  namespace: sip-test
spec:
  selector:
    matchLabels:
      app: masq-exempt
  template:
    metadata:
      labels:
        app: masq-exempt
    spec:
      containers:
      - args:
        - "#!/bin/sh\n# The masq-exempt DaemonSet's loop, on every node's network\
          \ namespace\n# (hostNetwork). Reads PROXY_VIP, EXTERNAL_VIP, EXTERNAL_SUBNET,\n\
          # EXTERNAL_INTERFACE and PERIOD from its env; the chart never rewrites this\n\
          # text.\n#\n# kindnetd's KIND-MASQ-AGENT chain (nat POSTROUTING) exempts\
          \ only the pod CIDR.\n# The SIP plane keeps real addresses: worker -> internal\
          \ VIP would be SNAT'd to\n# a node IP with its source port remapped, and\
          \ the VIP-sourced replies would no\n# longer match the peer's conntrack\
          \ tuple; the external plane is never\n# masqueraded either. One RETURN rule\
          \ per identity and direction at position 1,\n# re-asserted every PERIOD\
          \ seconds so a kindnetd reconcile wipes them for one\n# period at most.\n\
          #\n# One filter rule rides the same loop: a packet for the internal VIP\
          \ arriving\n# on the external interface is dropped. The proxy trusts whatever\
          \ reaches its\n# internal socket (ADR-0048), and a proxy node owns both\
          \ VIPs: a neighbour on\n# the callers' plane that routes the internal VIP\
          \ through this node is\n# refused here, whatever the routers announce.\n\
          # One RETURN rule in KIND-MASQ-AGENT: $1 is -s or -d, $2 the address.\n\
          exempt() {\n  iptables -t nat -C KIND-MASQ-AGENT \"$1\" \"$2\" -j RETURN\
          \ 2>/dev/null \\\n    || { iptables -t nat -I KIND-MASQ-AGENT 1 \"$1\" \"\
          $2\" -j RETURN && echo \"masq-exempt: inserted $1 $2 RETURN\"; }\n}\necho\
          \ \"masq-exempt: asserting KIND-MASQ-AGENT RETURN rules for $PROXY_VIP,\
          \ $EXTERNAL_VIP, $EXTERNAL_SUBNET and the $EXTERNAL_INTERFACE -> $PROXY_VIP\
          \ DROP (period ${PERIOD}s)\"\nwhile true; do\n  iptables -C INPUT -i \"\
          $EXTERNAL_INTERFACE\" -d \"$PROXY_VIP/32\" -j DROP 2>/dev/null \\\n    ||\
          \ { iptables -I INPUT 1 -i \"$EXTERNAL_INTERFACE\" -d \"$PROXY_VIP/32\"\
          \ -j DROP && echo \"masq-exempt: inserted INPUT -i $EXTERNAL_INTERFACE -d\
          \ $PROXY_VIP/32 DROP\"; }\n  if iptables -t nat -nL KIND-MASQ-AGENT >/dev/null\
          \ 2>&1; then\n    exempt -s \"$PROXY_VIP/32\"\n    exempt -d \"$PROXY_VIP/32\"\
          \n    exempt -s \"$EXTERNAL_VIP/32\"\n    exempt -d \"$EXTERNAL_SUBNET\"\
          \n  fi\n  sleep \"$PERIOD\"\ndone\n"
        command:
        - /bin/sh
        - -c
        env:
        - name: PROXY_VIP
          value: 172.20.255.250
        - name: EXTERNAL_VIP
          value: 192.168.60.250
        - name: EXTERNAL_SUBNET
          value: 192.168.60.0/25
        - name: EXTERNAL_INTERFACE
          value: eth1
        - name: PERIOD
          value: '15'
        image: siprustserver-nettools:dev
        imagePullPolicy: IfNotPresent
        name: masq-exempt
        resources:
          limits:
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 8Mi
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
      hostNetwork: true
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
---

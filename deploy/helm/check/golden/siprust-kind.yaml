apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: b2bua-worker
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: b2bua-worker
    app.kubernetes.io/part-of: siprust
    helm.sh/chart: siprust-0.1.0
  name: b2bua-worker
  namespace: sip-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: b2bua-worker
  serviceName: b2bua-worker
  template:
    metadata:
      annotations:
        prometheus.io/port: '9091'
        prometheus.io/scrape: 'true'
      labels:
        app: b2bua-worker
    spec:
      containers:
      - command:
        - /usr/local/bin/b2bua-runner
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: B2BUA_CLUSTER_KEY
          valueFrom:
            secretKeyRef:
              key: key
              name: b2bua-worker-cluster-key
        - name: B2BUA_ADVERTISE
          value: $(POD_IP):5060
        - name: B2BUA_CDR_RABBITMQ_MAX_LEN
          value: '100000'
        - name: B2BUA_CDR_RABBITMQ_QUEUE
          value: cdr
        - name: B2BUA_CDR_RABBITMQ_URL
          value: amqp://guest:guest@rabbitmq.sip-test.svc.cluster.local:5672/%2f
        - name: B2BUA_CONTACT_ADDRESS
          value: 192.168.60.250:5060
        - name: B2BUA_DEST
          value: 192.168.60.21:5060
        - name: B2BUA_DRAIN_CDR_FLUSH_MS
          value: '3000'
        - name: B2BUA_DRAIN_GRACE_MS
          value: '5000'
        - name: B2BUA_DRAIN_MIN_MS
          value: '1000'
        - name: B2BUA_DRAIN_RELEASE_FLUSH_MS
          value: '3000'
        - name: B2BUA_KEEPALIVE_SEC
          value: '300'
        - name: B2BUA_KEEPALIVE_TIMEOUT_SEC
          value: '120'
        - name: B2BUA_LISTEN
          value: 0.0.0.0:5060
        - name: B2BUA_METRICS
          value: 0.0.0.0:9091
        - name: B2BUA_MODE
          value: proxied
        - name: B2BUA_ORDINAL
          value: $(POD_NAME)
        - name: B2BUA_OUTBOUND_PROXY
          value: 172.20.255.250:5060
        - name: B2BUA_RELAY_HEADERS
          value: X-Loadgen-Id
        - name: B2BUA_REPL
          value: '1'
        - name: B2BUA_REPL_LISTEN
          value: 0.0.0.0:9092
        - name: B2BUA_REPL_PORT
          value: '9092'
        - name: B2BUA_REPL_SERVICE
          value: b2bua-worker
        - name: B2BUA_STRESS_LIMITER_ID
          value: global-stress
        - name: B2BUA_STRESS_LIMITER_LIMIT
          value: '999999'
        - name: B2BUA_UDP_RCVBUF
          value: '4194304'
        - name: B2BUA_UDP_SNDBUF
          value: '4194304'
        - name: LIMITER_REFRESH_SECONDS
          value: '40'
        - name: LIMITER_RELEASE_TIMEOUT_MS
          value: '2000'
        - name: LIMITER_TIMEOUT_MS
          value: '150'
        - name: LIMITER_URL
          value: call-limiter.sip-test.svc.cluster.local:8080
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://172.20.0.1:10428/insert/opentelemetry
        - name: SIP_TRACE_HEADER
          value: '1'
        - name: WORKER_ALLOWED_TARGET_SUFFIXES
          value: .svc.cluster.local
        - name: _RJEM_MALLOC_CONF
          value: prof:true,prof_active:true,lg_prof_sample:19,prof_prefix:/tmp/jeprof/auto
        image: siprustserver:dev
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 9091
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        name: b2bua-worker
        ports:
        - containerPort: 5060
          name: sip
          protocol: UDP
        - containerPort: 9091
          name: metrics
          protocol: TCP
        - containerPort: 9092
          name: repl
          protocol: TCP
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /ready
            port: 9091
          initialDelaySeconds: 1
          periodSeconds: 2
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 128Mi
      nodeSelector:
        tier: app
      serviceAccountName: b2bua-worker
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: b2bua-worker
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule

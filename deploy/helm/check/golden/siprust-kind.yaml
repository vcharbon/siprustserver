apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rabbitmq
    app.kubernetes.io/instance: rel
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: siprust
    helm.sh/chart: siprust-0.1.0
  name: rabbitmq
  namespace: sip-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: '15692'
        prometheus.io/scrape: 'true'
      labels:
        app: rabbitmq
    spec:
      containers:
      - env:
        - name: RABBITMQ_DEFAULT_USER
          value: guest
        - name: RABBITMQ_DEFAULT_PASS
          value: guest
        image: rabbitmq:3.13-management
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 15
        name: rabbitmq
        ports:
        - containerPort: 5672
          name: amqp
          protocol: TCP
        - containerPort: 15692
          name: metrics
          protocol: TCP
        - containerPort: 15672
          name: mgmt
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 3
          tcpSocket:
            port: 5672
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - mountPath: /var/lib/rabbitmq
          name: data
      nodeSelector:
        tier: infra
      tolerations:
      - effect: NoSchedule
        key: tier
        operator: Equal
        value: infra
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 512Mi
        name: data

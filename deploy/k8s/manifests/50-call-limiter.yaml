# Call-limiter service — the dedicated, stateless concurrency limiter keyed by
# the call, shared cluster-wide. SINGLE replica (Deployment, not StatefulSet):
# one authoritative in-memory set per call, no persistence. On restart the
# store is empty: the counted calls re-register their sets on their next
# refresh (ADR-0040), and the b2bua fails open during the brief downtime — so
# this is a SPOF for the limiter function only, never for calls.
#
# The b2bua workers reach it at call-limiter:8080 (LIMITER_URL on the worker).
# Inert until a /call/new decision returns `call_limiter` entries.
#
# Image: ${SUT_IMAGE} (default siprustserver:dev), command = call-limiter-runner.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: call-limiter
  namespace: sip-test
  labels: { app: call-limiter }
spec:
  replicas: 1
  selector: { matchLabels: { app: call-limiter } }
  strategy: { type: Recreate } # never two authoritative counters at once
  template:
    metadata:
      labels: { app: call-limiter }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # The infra node (cluster.yaml), alone with the other shared dependencies.
      nodeSelector: { tier: infra }
      tolerations:
        - { key: tier, operator: Equal, value: infra, effect: NoSchedule }
      containers:
        - name: call-limiter
          image: ${SUT_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/call-limiter-runner"]
          # NET_ADMIN lets the chaos suite exec `tc qdisc ... netem` inside this
          # pod to simulate a network interruption to the shared limiter WITHOUT
          # killing it (the limiter_netcut chaos event). Test-cluster only.
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - { name: LIMITER_LISTEN,           value: "0.0.0.0:8080" }
            # Every admit and refresh answer states the lease; the workers give
            # their queued releases and refreshes up by it.
            - { name: LIMITER_LEASE_SECONDS,    value: "120" }
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "32Mi" }
            limits:   { memory: "256Mi" }
---
# Stable ClusterIP so the workers reach a single, consistent counter set. The
# ClusterIP is stable for the Service's lifetime, so the workers' startup DNS
# resolution stays valid across limiter-pod restarts.
apiVersion: v1
kind: Service
metadata:
  name: call-limiter
  namespace: sip-test
spec:
  selector: { app: call-limiter }
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }

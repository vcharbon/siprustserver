# The one clippy configuration of the workspace: clippy reads the nearest
# clippy.toml and does not merge, so no crate holds its own (ADR-0051 §3).

# One concept per function: anything longer almost always wants extraction.
# 200 is the current ceiling — ratchet down as offenders shrink.
too-many-lines-threshold = 200

# The disallowed lists below are the panic and purity rules of ADR-0051. The
# workspace lint table holds the three lints at `allow`; scripts/panic-sites.py
# runs them with the panic set over every tiered crate. An entry whose reason
# starts with `pure tier` counts in pure crates only, every other entry in
# both tiers. Each panic entry names its checked alternative.

disallowed-macros = [
  { path = "std::assert", reason = "panics; return an error (`debug_assert!` stays allowed)" },
  { path = "std::assert_eq", reason = "panics; return an error (`debug_assert_eq!` stays allowed)" },
  { path = "std::assert_ne", reason = "panics; return an error (`debug_assert_ne!` stays allowed)" },
  { path = "std::thread_local", reason = "pure tier: process-global mutable state; pass the state in" },
  { path = "std::print", reason = "pure tier: writes stdout; return the text" },
  { path = "std::println", reason = "pure tier: writes stdout; return the text" },
  { path = "std::eprint", reason = "pure tier: writes stderr; return the text" },
  { path = "std::eprintln", reason = "pure tier: writes stderr; return the text" },
]

disallowed-methods = [
  # What `unwrap_used` / `expect_used` see, also inside a local macro's
  # expansion, where those lints do not look; one site where both see it.
  { path = "std::option::Option::unwrap", reason = "panics on `None`; handle it or return an error" },
  { path = "std::option::Option::expect", reason = "panics on `None`; handle it or return an error" },
  { path = "std::result::Result::unwrap", reason = "panics on `Err`; handle it or return it" },
  { path = "std::result::Result::expect", reason = "panics on `Err`; handle it or return it" },
  { path = "std::result::Result::unwrap_err", reason = "panics on `Ok`; match on it" },
  { path = "std::result::Result::expect_err", reason = "panics on `Ok`; match on it" },
  # Panics inside library calls.
  { path = "slice::split_at", reason = "panics past the end; use `split_at_checked`" },
  { path = "slice::split_at_mut", reason = "panics past the end; use `split_at_mut_checked`" },
  { path = "str::split_at", reason = "panics past the end or inside a char; use `split_at_checked`" },
  { path = "slice::copy_from_slice", reason = "panics on a length mismatch; copy through `get_mut(..n)` after checking the lengths, or `extend_from_slice`" },
  { path = "slice::clone_from_slice", reason = "panics on a length mismatch; use `extend_from_slice`" },
  { path = "std::vec::Vec::remove", reason = "panics past the end; check with `get` first or use `VecDeque::remove`" },
  { path = "std::vec::Vec::insert", reason = "panics past the end; use `push`, or check the index against `len()`" },
  { path = "std::vec::Vec::swap_remove", reason = "panics past the end; check with `get` first" },
  { path = "std::vec::Vec::drain", reason = "panics on a range past the end; use `drain(..)` or `split_off` on a checked index" },
  { path = "std::vec::Vec::split_off", reason = "panics past the end; check the index against `len()`" },
  { path = "std::string::String::remove", reason = "panics past the end or inside a char; use `char_indices` and `get`" },
  { path = "std::string::String::insert", reason = "panics past the end or inside a char; check with `is_char_boundary`" },
  { path = "std::string::String::insert_str", reason = "panics past the end or inside a char; check with `is_char_boundary`" },
  { path = "std::string::String::drain", reason = "panics past the end or inside a char; use `get` on the range" },
  { path = "std::string::String::split_off", reason = "panics past the end or inside a char; use `split_at_checked`" },
  { path = "std::string::String::truncate", reason = "panics inside a char; check with `is_char_boundary`" },
  { path = "std::time::Duration::from_secs_f64", reason = "panics on a negative, infinite or NaN value; use `try_from_secs_f64`" },
  { path = "std::time::Duration::from_secs_f32", reason = "panics on a negative, infinite or NaN value; use `try_from_secs_f32`" },
  { path = "std::cell::RefCell::borrow", reason = "panics while mutably borrowed; use `try_borrow`" },
  { path = "std::cell::RefCell::borrow_mut", reason = "panics while borrowed; use `try_borrow_mut`" },
  { path = "std::sync::Mutex::lock", reason = "a poisoned lock stops the caller; lock through the poison-recovering helper" },
  { path = "std::sync::RwLock::read", reason = "a poisoned lock stops the caller; lock through the poison-recovering helper" },
  { path = "std::sync::RwLock::write", reason = "a poisoned lock stops the caller; lock through the poison-recovering helper" },
  { path = "bytes::Bytes::slice", reason = "panics on a range past the end; check the range against `len()` in one checked helper" },
  { path = "bytes::Bytes::split_to", reason = "panics past the end; check the index against `len()` in one checked helper" },
  { path = "bytes::Bytes::split_off", reason = "panics past the end; check the index against `len()` in one checked helper" },
  { path = "tokio_util::time::DelayQueue::insert", reason = "panics on a delay past the wheel's range; clamp it through the clock crate's checked helper" },
  { path = "tokio_util::time::DelayQueue::insert_at", reason = "panics on a deadline past the wheel's range; clamp it through the clock crate's checked helper" },
  { path = "tokio_util::time::DelayQueue::reset", reason = "panics on a delay past the wheel's range or a stale key; clamp it through the clock crate's checked helper" },
  { path = "tokio_util::time::DelayQueue::reset_at", reason = "panics on a deadline past the wheel's range or a stale key; clamp it through the clock crate's checked helper" },
  { path = "tokio::sync::mpsc::channel", reason = "panics on a zero capacity; pass a named non-zero constant (`#[expect]` with it)" },
  { path = "tokio::sync::broadcast::channel", reason = "panics on a zero capacity; pass a named non-zero constant (`#[expect]` with it)" },
  { path = "tokio::sync::Semaphore::new", reason = "panics above `Semaphore::MAX_PERMITS`; bound the count first (`#[expect]` with the bound)" },
  { path = "tokio::time::interval", reason = "panics on a zero period; bound it below first (`#[expect]` with the bound)" },
  { path = "tokio::time::interval_at", reason = "panics on a zero period; bound it below first (`#[expect]` with the bound)" },
  # Effects a pure crate does not do: time and identifiers enter as parameters.
  { path = "std::env::var", reason = "pure tier: reads the environment; take the value as a parameter" },
  { path = "std::env::var_os", reason = "pure tier: reads the environment; take the value as a parameter" },
  { path = "std::env::vars", reason = "pure tier: reads the environment; take the value as a parameter" },
  { path = "std::env::args", reason = "pure tier: reads the command line; take the value as a parameter" },
  { path = "std::env::args_os", reason = "pure tier: reads the command line; take the value as a parameter" },
  { path = "std::env::current_dir", reason = "pure tier: reads the process state; take the value as a parameter" },
  { path = "std::env::temp_dir", reason = "pure tier: reads the environment; take the value as a parameter" },
  { path = "std::fs::read", reason = "pure tier: reads the filesystem; take the bytes as a parameter" },
  { path = "std::fs::read_to_string", reason = "pure tier: reads the filesystem; take the text as a parameter" },
  { path = "std::fs::read_dir", reason = "pure tier: reads the filesystem" },
  { path = "std::fs::metadata", reason = "pure tier: reads the filesystem" },
  { path = "std::fs::write", reason = "pure tier: writes the filesystem; return the bytes" },
  { path = "std::fs::create_dir_all", reason = "pure tier: writes the filesystem" },
  { path = "std::fs::remove_file", reason = "pure tier: writes the filesystem" },
  { path = "std::fs::rename", reason = "pure tier: writes the filesystem" },
  { path = "std::fs::copy", reason = "pure tier: writes the filesystem" },
  { path = "std::fs::create_dir", reason = "pure tier: writes the filesystem" },
  { path = "std::fs::remove_dir", reason = "pure tier: writes the filesystem" },
  { path = "std::fs::remove_dir_all", reason = "pure tier: writes the filesystem" },
  { path = "std::fs::canonicalize", reason = "pure tier: reads the filesystem" },
  { path = "std::fs::symlink_metadata", reason = "pure tier: reads the filesystem" },
  { path = "std::fs::read_link", reason = "pure tier: reads the filesystem" },
  { path = "std::fs::set_permissions", reason = "pure tier: writes the filesystem" },
  { path = "std::fs::hard_link", reason = "pure tier: writes the filesystem" },
  { path = "std::env::set_var", reason = "pure tier: writes the environment" },
  { path = "std::env::remove_var", reason = "pure tier: writes the environment" },
  { path = "std::env::set_current_dir", reason = "pure tier: writes the process state" },
  { path = "std::env::current_exe", reason = "pure tier: reads the process state" },
  { path = "std::path::Path::exists", reason = "pure tier: reads the filesystem" },
  { path = "std::path::Path::try_exists", reason = "pure tier: reads the filesystem" },
  { path = "std::path::Path::is_file", reason = "pure tier: reads the filesystem" },
  { path = "std::path::Path::is_dir", reason = "pure tier: reads the filesystem" },
  { path = "std::path::Path::metadata", reason = "pure tier: reads the filesystem" },
  { path = "std::path::Path::read_dir", reason = "pure tier: reads the filesystem" },
  { path = "std::path::Path::canonicalize", reason = "pure tier: reads the filesystem" },
  { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "pure tier: resolves names over the network" },
  { path = "std::thread::sleep", reason = "pure tier: sleeps; return the delay" },
  { path = "std::thread::spawn", reason = "pure tier: spawns a thread" },
  { path = "std::process::exit", reason = "pure tier: ends the process; return an error" },
  { path = "std::process::abort", reason = "pure tier: ends the process; return an error" },
  { path = "std::io::stdin", reason = "pure tier: reads stdin; take the bytes as a parameter" },
  { path = "std::io::stdout", reason = "pure tier: writes stdout; return the text" },
  { path = "std::io::stderr", reason = "pure tier: writes stderr; return the text" },
]

disallowed-types = [
  # Effects a pure crate does not do.
  { path = "std::time::Instant", reason = "pure tier: reads the clock; take the instant as a parameter" },
  { path = "std::time::SystemTime", reason = "pure tier: reads the clock; take the time as a parameter" },
  { path = "std::fs::File", reason = "pure tier: filesystem" },
  { path = "std::fs::OpenOptions", reason = "pure tier: filesystem" },
  { path = "std::net::UdpSocket", reason = "pure tier: network" },
  { path = "std::net::TcpStream", reason = "pure tier: network" },
  { path = "std::net::TcpListener", reason = "pure tier: network" },
  { path = "std::process::Command", reason = "pure tier: spawns a process" },
  { path = "std::thread::Builder", reason = "pure tier: spawns a thread" },
  { path = "std::os::unix::net::UnixStream", reason = "pure tier: network" },
  { path = "std::os::unix::net::UnixListener", reason = "pure tier: network" },
  { path = "std::os::unix::net::UnixDatagram", reason = "pure tier: network" },
  # Interior mutability: a pure function's output depends only on its inputs.
  { path = "std::cell::Cell", reason = "pure tier: interior mutability; return the new value" },
  { path = "std::cell::RefCell", reason = "pure tier: interior mutability; return the new value" },
  { path = "std::cell::OnceCell", reason = "pure tier: interior mutability; compute the value up front" },
  { path = "std::cell::LazyCell", reason = "pure tier: interior mutability; compute the value up front" },
  { path = "std::cell::UnsafeCell", reason = "pure tier: interior mutability; return the new value" },

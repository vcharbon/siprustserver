  { path = "std::sync::RwLock", reason = "pure tier: interior mutability; return the new value" },
  { path = "std::sync::Condvar", reason = "pure tier: interior mutability" },
  { path = "std::sync::OnceLock", reason = "pure tier: process-global state; pass the value in" },
  { path = "std::sync::LazyLock", reason = "pure tier: process-global state; pass the value in" },
  { path = "once_cell::sync::Lazy", reason = "pure tier: process-global state; pass the value in" },
  { path = "once_cell::sync::OnceCell", reason = "pure tier: process-global state; pass the value in" },
  { path = "once_cell::unsync::Lazy", reason = "pure tier: interior mutability; compute the value up front" },
  { path = "once_cell::unsync::OnceCell", reason = "pure tier: interior mutability; compute the value up front" },
  { path = "std::sync::atomic::AtomicBool", reason = "pure tier: interior mutability; return the new value" },
  { path = "std::sync::atomic::AtomicI8", reason = "pure tier: interior mutability; return the new value" },
  { path = "std::sync::atomic::AtomicI16", reason = "pure tier: interior mutability; return the new value" },
  { path = "std::sync::atomic::AtomicI32", reason = "pure tier: interior mutability; return the new value" },
  { path = "std::sync::atomic::AtomicI64", reason = "pure tier: interior mutability; return the new value" },
  { path = "std::sync::atomic::AtomicIsize", reason = "pure tier: interior mutability; return the new value" },
  { path = "std::sync::atomic::AtomicU8", reason = "pure tier: interior mutability; return the new value" },
  { path = "std::sync::atomic::AtomicU16", reason = "pure tier: interior mutability; return the new value" },
  { path = "std::sync::atomic::AtomicU32", reason = "pure tier: interior mutability; return the new value" },
  { path = "std::sync::atomic::AtomicU64", reason = "pure tier: interior mutability; return the new value" },
